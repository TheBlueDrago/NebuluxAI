    <script>
      // Before anything draws: the theme last used on this device (src/lib/theme.js), else the
      // device's own light/dark setting, so opening the app doesn't flash black then white.
      // The public pages are always dark.
      (function () {
        try {
          var t = localStorage.getItem("bh-theme");
          var light = t ? t === "light" : window.matchMedia("(prefers-color-scheme: light)").matches;
          if (light && /^\/(chat|billing|plans|promo-success|ThankYou)(\/|$)/.test(location.pathname)) {
            document.documentElement.classList.add("light");
            document.body.style.background = "#f8fafc";

        } catch (e) {}
      })();
