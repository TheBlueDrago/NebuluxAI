<!doctype html>
<!-- A code file that isn't there (usually one from an older version, gone after an update) gets a real
     "not found" from Cloudflare Pages instead of the app page passed off as code, so the app's reload
     fixes it. Pages uses the closest 404.html; everything outside /assets still gets the app page. -->
<meta charset="utf-8"><meta name="robots" content="noindex"><title>Not found</title><p>Not found.</p>
