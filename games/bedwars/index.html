<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bedwars - Nebulux AI</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#87c8ff;font-family:"Segoe UI",Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block}
.ov{position:fixed;inset:0;display:none;z-index:20;color:#fff;text-align:center;overflow-y:auto}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6)}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross:before{left:8px;top:0;width:2px;height:18px}#cross:after{top:8px;left:0;height:2px;width:18px}
#hotbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:4px;pointer-events:auto}
.slot{width:54px;height:54px;background:rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.25);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px;position:relative;cursor:pointer}
.slot.on{border-color:#fff;background:rgba(255,255,255,.18)}
.slot b{position:absolute;right:3px;bottom:0;font-size:13px}
#hearts{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);font-size:17px;letter-spacing:1px;white-space:nowrap}
#armorTxt{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);font-size:13px;opacity:.9}
#res{position:absolute;left:12px;bottom:12px;font-size:17px;font-weight:800;line-height:1.5;background:rgba(0,0,0,.35);padding:6px 12px;border-radius:10px}
#teams{position:absolute;left:12px;top:12px;font-size:15px;font-weight:800;background:rgba(0,0,0,.35);padding:8px 12px;border-radius:10px;line-height:1.55}
#feed{position:absolute;right:12px;top:52px;font-size:14px;font-weight:700;text-align:right;line-height:1.6}
#timer{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-weight:900;font-size:16px;background:rgba(0,0,0,.35);padding:4px 14px;border-radius:10px}
#big{position:absolute;left:0;right:0;top:26%;text-align:center;font-size:44px;font-weight:900;font-style:italic;opacity:0;transition:opacity .3s}
#sub{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:20px;font-weight:800;opacity:0;transition:opacity .3s}
#hint{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-size:16px;font-weight:800;background:rgba(0,0,0,.45);padding:6px 14px;border-radius:10px;display:none}
#breakbar{position:absolute;left:50%;top:calc(50% + 22px);transform:translateX(-50%);width:80px;height:6px;background:rgba(0,0,0,.5);border-radius:3px;display:none}
#breakbar i{display:block;height:100%;background:#fff;border-radius:3px;width:0}
#lobbyui{position:fixed;left:0;right:0;bottom:14px;display:none;justify-content:center;gap:10px;flex-wrap:wrap;z-index:6;padding:0 10px}
.btn{font:900 18px "Segoe UI",Arial;padding:12px 22px;border:0;border-radius:12px;cursor:pointer;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
#lobbytop{position:fixed;left:12px;top:12px;z-index:6;display:none;color:#fff;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.5);font-size:15px;background:rgba(0,0,0,.35);padding:8px 12px;border-radius:10px;line-height:1.5}
#chat{position:fixed;right:12px;top:12px;width:300px;max-width:45vw;z-index:7;font-size:13px;color:#fff;display:none}
#chatlog{max-height:150px;overflow-y:auto;background:rgba(0,0,0,.35);border-radius:10px;padding:6px 8px;line-height:1.45;text-shadow:0 1px 0 #000}
#chatin{display:none;width:100%;margin-top:4px;padding:7px 9px;border-radius:8px;border:0;font-size:14px;outline:none}
#shop .box,#upg .box,#queue .box,#results .box{max-width:760px;margin:6vh auto;background:linear-gradient(#2a1d5c,#170f38);border:3px solid #6f5bd6;border-radius:18px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.tab{padding:8px 14px;border-radius:10px;background:#3b2c7a;cursor:pointer;font-weight:800}
.tab.on{background:#ffcf33;color:#3a2300}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.item{background:#3b2c7a;border-radius:12px;padding:10px;cursor:pointer;border:2px solid transparent}
.item:hover{border-color:#ffcf33}
.item.no{opacity:.45;cursor:not-allowed}
.item .ic{font-size:34px}
.item .nm{font-weight:800;margin:4px 0}
.item .co{font-size:13px;font-weight:700}
.close{margin-top:14px;background:#ff4b4b}
.crow{display:grid;grid-template-columns:1.4fr .6fr 1fr 1fr .6fr;gap:8px;align-items:center;background:#3b2c7a;border-radius:10px;padding:6px 10px;margin:5px 0;font-weight:800}
.crow button{font:800 13px "Segoe UI",Arial;border:0;border-radius:8px;padding:7px 6px;cursor:pointer;color:#fff;background:#1e88e5}
.crow button[disabled]{opacity:.35;cursor:default}
#touch{position:fixed;inset:0;z-index:4;display:none;pointer-events:none}
#joy{position:absolute;left:24px;bottom:110px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.35);pointer-events:auto}
#joyk{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.5)}
.tb{position:absolute;width:70px;height:70px;border-radius:50%;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.5);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;pointer-events:auto}
#lockhint{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:8;color:#fff;background:rgba(0,0,0,.55);padding:12px 22px;border-radius:12px;font-weight:800;display:none;pointer-events:none}
</style>
</head>
<body>
<div id="hud">
  <div id="cross"></div>
  <div id="timer"></div>
  <div id="teams"></div>
  <div id="feed"></div>
  <div id="res"></div>
  <div id="armorTxt"></div>
  <div id="hearts"></div>
  <div id="hotbar"></div>
  <div id="big"></div>
  <div id="sub"></div>
  <div id="hint"></div>
  <div id="breakbar"><i></i></div>
  
</div>
<div id="lobbytop"></div>
<div id="lobbyui">
  <button class="btn" data-q="bw1" style="background:#e53935">SOLOS</button>
  <button class="btn" data-q="bw2" style="background:#1e88e5">DUOS</button>
  <button class="btn" data-q="bw4" style="background:#43a047">SQUADS</button>
  <button class="btn" id="practice" style="background:#8e24aa">🤖 PLAY WITH BOTS</button>
  <button class="btn" id="v100" style="background:linear-gradient(#ff7043,#d84315)">💯 1 v 100</button>
</div>
<div id="chat"><div id="chatlog"></div><input id="chatin" maxlength="80" placeholder="Say something nice… (Enter to send)"></div>
<button class="btn" id="raidbtn" style="display:none;position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:9;background:linear-gradient(#ff5252,#b71c1c);font-size:22px">⚔️ LET THE RAID BEGIN (R)</button>
<div id="lockhint">Click to play · Esc to free the mouse</div>
<div id="touch">
  <div id="joy"><div id="joyk"></div></div>
  <div class="tb" id="tJump" style="right:30px;bottom:120px">⤴</div>
  <div class="tb" id="tHit" style="right:110px;bottom:150px">⚔️</div>
  <div class="tb" id="tUse" style="right:30px;bottom:200px">🧱</div>
  <div class="tb" id="tShop" style="right:110px;bottom:230px;font-size:20px">🛒</div>
</div>
<div class="ov" id="shop"><div class="box"><h2 style="margin:0;font-size:30px">🛒 ITEM SHOP</h2><div id="shopres" style="font-weight:800;margin-top:6px"></div><div class="tabs" id="shoptabs"></div><div class="items" id="shopitems"></div><div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><input id="promo" maxlength="40" placeholder="Promo code" style="padding:10px 12px;border-radius:10px;border:0;font-size:15px;width:220px"><button class="btn" id="promogo" style="background:#8e24aa;font-size:15px;padding:10px 16px">REDEEM</button></div><div id="promomsg" style="font-weight:800;margin-top:6px"></div><button class="btn close" id="shopclose">✕ CLOSE (E)</button></div></div>
<div class="ov" id="chest"><div class="box"><h2 id="chtitle" style="margin:0;font-size:30px"></h2><p id="chsub" style="margin:6px 0 10px;font-weight:700;opacity:.85"></p><div id="chrows"></div><button class="btn close" id="chclose">✕ CLOSE (E)</button></div></div>
<div class="ov" id="upg"><div class="box"><h2 style="margin:0;font-size:30px">💎 TEAM UPGRADES</h2><div id="upgres" style="font-weight:800;margin-top:6px"></div><div class="items" id="upgitems"></div><button class="btn close" id="upgclose">✕ CLOSE (E)</button></div></div>
<div class="ov" id="queue" style="background:rgba(0,0,0,.4)"><div class="box"><h2 id="qtitle" style="margin:0;font-size:30px"></h2><p id="qtext" style="font-size:18px;font-weight:700"></p><div id="qlist" style="font-weight:700;opacity:.9"></div><button class="btn close" id="qcancel">✕ LEAVE QUEUE</button></div></div>
<div class="ov" id="results" style="background:radial-gradient(circle at 50% 30%,rgba(90,40,200,.75),rgba(10,0,40,.92))"><div class="box"><h1 id="rtitle" style="font-size:52px;margin:6px 0;font-style:italic"></h1><p id="rtext" style="font-size:17px;font-weight:700;line-height:1.6"></p><button class="btn" id="ragain" style="background:linear-gradient(#ffe14a,#ffb000);color:#3a2300">PLAY AGAIN</button> <button class="btn" id="rlobby" style="background:linear-gradient(#b8ff9f,#3ed14a);color:#0b3010">🏠 BACK TO LOBBY</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const NAME=String((window.nebulux&&window.nebulux.username)||"").trim().slice(0,24)||"Anonymous";
const WS_URL="wss://nebulux-multiplayer.thebluedragonstriker.workers.dev/play?game=bedwars";
const TOUCH=matchMedia("(pointer:coarse)").matches;

// ---------- saved stats ----------
let SAVE={wins:0,kills:0,finals:0,beds:0,games:0};
try{Object.assign(SAVE,JSON.parse(localStorage.getItem("bw-save")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("bw-save",JSON.stringify(SAVE))}catch(e){}};

// ---------- three.js ----------
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ccfff);scene.fog=new THREE.Fog(0x8ccfff,70,190);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,400);scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffffff,0x6b7a8f,.8));
const sunL=new THREE.DirectionalLight(0xffffff,.6);sunL.position.set(40,90,25);scene.add(sunL);
addEventListener("resize",()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
const DEC=new THREE.Group();scene.add(DEC);

// ---------- block textures (16x16 pixel art) ----------
function tex(base,spots,seed,extra){const c=document.createElement("canvas");c.width=c.height=16;const k=c.getContext("2d");let s=seed;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
 for(let x=0;x<16;x++)for(let y=0;y<16;y++){k.fillStyle=rnd()<.55?base:spots[Math.floor(rnd()*spots.length)];k.fillRect(x,y,1,1)}
 if(extra)extra(k,rnd);const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;return t}
const lam=(map,opt)=>new THREE.MeshLambertMaterial(Object.assign({map},opt||{}));
const TEAMS=[{n:"Red",c:0xe53935,css:"#ff5252",w:["#d32f2f","#c62828","#e53935"]},{n:"Blue",c:0x1e88e5,css:"#4aa3ff",w:["#1976d2","#1565c0","#1e88e5"]},{n:"Green",c:0x43a047,css:"#5ad65f",w:["#388e3c","#2e7d32","#43a047"]},{n:"Yellow",c:0xfdd835,css:"#ffe14a",w:["#fbc02d","#f9a825","#fdd835"]}];
const BDEF={};
const defB=(id,name,mat,hard,top)=>BDEF[id]={id,name,mat,hard,top:top||1};
defB(1,"Grass",lam(tex("#5fae3a",["#4e9a2f","#6cc046","#56a334"],7)),-1);
defB(2,"Dirt",lam(tex("#8a5a35",["#7a4d2b","#9a6a40","#6d4426"],11)),-1);
defB(3,"Stone",lam(tex("#8d8d8d",["#7c7c7c","#a0a0a0","#868686"],13)),-1);
defB(4,"Wood",lam(tex("#b5884f",["#a87b44","#c2955a"],17,k=>{k.fillStyle="#8d6634";for(let y=3;y<16;y+=4)k.fillRect(0,y,16,1);k.fillRect(7,0,1,3);k.fillRect(3,4,1,4);k.fillRect(11,8,1,4);k.fillRect(5,12,1,4)})),1.0);
defB(5,"End stone",lam(tex("#e8e7a8",["#d9d796","#f2f1b8","#cfcc8a"],19)),1.6);
defB(6,"Bricks",lam(tex("#a7a7b4",["#9696a3","#b5b5c2"],23,k=>{k.fillStyle="#7d7d8a";for(let y=0;y<16;y+=4){k.fillRect(0,y,16,1);for(let x=(y%8?4:0);x<16;x+=8)k.fillRect(x,y,1,4)}})),-1);
defB(7,"Obsidian",lam(tex("#2a1745",["#1b0f2e","#3a2260","#24133b"],29)),-1);
defB(8,"Generator",lam(tex("#5b5b66",["#4b4b55","#6b6b77"],31,k=>{k.fillStyle="#ffd54a";k.fillRect(2,2,12,1);k.fillRect(2,13,12,1)})),-1);
defB(9,"Diamond block",lam(tex("#4fe3e0",["#36c9c6","#7af0ee"],37)),-1);
defB(14,"Emerald block",lam(tex("#2fd36b",["#20b85a","#5be88e"],41)),-1);
TEAMS.forEach((t,i)=>{defB(10+i,t.n+" wool",lam(tex(t.w[0],t.w,43+i,k=>{k.globalAlpha=.25;k.fillStyle="#000";for(let x=0;x<16;x+=2)k.fillRect(x,(x*7)%16,1,1);k.globalAlpha=1})),.35);
 defB(20+i,t.n+" bed",[lam(tex(t.w[0],t.w,53+i)),lam(tex("#f4f4f4",["#e6e6e6"],61)),lam(tex(t.w[0],t.w,53+i))][0],.5,.56)});
defB(15,"Ender chest",lam(tex("#173a35",["#0f2925","#1f4d46","#2a1745"],71,k=>{k.fillStyle="#0b1d1a";k.fillRect(0,5,16,1);k.fillStyle="#4fe3c0";k.fillRect(7,4,2,3)})),-1);
defB(16,"Team chest",lam(tex("#a87133",["#8d5c26","#b8823f"],73,k=>{k.fillStyle="#5b3a15";k.fillRect(0,0,16,1);k.fillRect(0,15,16,1);k.fillRect(0,5,16,1);k.fillStyle="#d9d9d9";k.fillRect(7,4,2,3)})),-1);
const isBed=t=>t>=20&&t<24, isWool=t=>t>=10&&t<14;
const boxGeo=new THREE.BoxGeometry(1,1,1).translate(.5,.5,.5);
const bedGeo=new THREE.BoxGeometry(1,.56,1).translate(.5,.28,.5);

// ---------- the block world ----------
const W=new Map(),PLACED=new Set(),BT={};const CAP=12000;const _m=new THREE.Matrix4();
const K=(x,y,z)=>((x+1000)*2048+(y+1000))*2048+(z+1000);
const getB=(x,y,z)=>W.get(K(x,y,z))||0;
const topOf=t=>(BDEF[t]&&BDEF[t].top)||1;
function btype(t){if(BT[t])return BT[t];const m=new THREE.InstancedMesh(isBed(t)?bedGeo:boxGeo,BDEF[t].mat,CAP);m.count=0;m.frustumCulled=false;scene.add(m);return BT[t]={mesh:m,keys:[],idx:new Map()}}
function setBlock(x,y,z,t,placed){const k=K(x,y,z);const old=W.get(k)||0;if(old===t)return;
 if(old){const r=BT[old];const i=r.idx.get(k);const last=r.keys.length-1;if(i!==last){const lk=r.keys[last];r.keys[i]=lk;r.idx.set(lk,i);r.mesh.getMatrixAt(last,_m);r.mesh.setMatrixAt(i,_m)}
  r.keys.pop();r.idx.delete(k);r.mesh.count=r.keys.length;r.mesh.instanceMatrix.needsUpdate=true;W.delete(k);PLACED.delete(k)}
 if(t){const r=btype(t);const i=r.keys.length;if(i>=CAP)return;r.keys.push(k);r.idx.set(k,i);_m.makeTranslation(x,y,z);r.mesh.setMatrixAt(i,_m);r.mesh.count=i+1;r.mesh.instanceMatrix.needsUpdate=true;W.set(k,t);if(placed)PLACED.add(k)}}
function clearWorld(){for(const t in BT){const r=BT[t];r.keys=[];r.idx.clear();r.mesh.count=0}W.clear();PLACED.clear();
 while(DEC.children.length)DEC.remove(DEC.children[0]);for(const e of ENTS)if(e.mesh)scene.remove(e.mesh);ENTS.length=0;for(const p of PROJ)scene.remove(p.mesh);PROJ.length=0;GENS.length=0;NPCS.length=0;PORTALS.length=0}
const canBreak=(x,y,z)=>{const t=getB(x,y,z);return t&&(PLACED.has(K(x,y,z))||isBed(t))};

// ---------- physics ----------
function boxHits(x,y,z,hh){hh=hh||1.8;const x0=Math.floor(x-.3),x1=Math.floor(x+.3-1e-6),y0=Math.floor(y),y1=Math.floor(y+hh-1e-6),z0=Math.floor(z-.3),z1=Math.floor(z+.3-1e-6);
 for(let bx=x0;bx<=x1;bx++)for(let by=y0;by<=y1;by++)for(let bz=z0;bz<=z1;bz++){const t=getB(bx,by,bz);if(t&&by+topOf(t)>y+1e-4)return true}return false}
function moveEnt(e,dt){for(let k=0;k<4&&boxHits(e.pos.x,e.pos.y,e.pos.z);k++)e.pos.y=Math.floor(e.pos.y+1e-3)+1; // stuck inside a block: climb out
 const steps=Math.max(1,Math.ceil(dt/.016));const h=dt/steps;
 for(let s=0;s<steps;s++){e.vel.y-=28*h;if(e.vel.y<-45)e.vel.y=-45;
  const nx=e.pos.x+e.vel.x*h;if(!boxHits(nx,e.pos.y,e.pos.z))e.pos.x=nx;else{e.vel.x=0;e.bump=true}
  const nz=e.pos.z+e.vel.z*h;if(!boxHits(e.pos.x,e.pos.y,nz))e.pos.z=nz;else{e.vel.z=0;e.bump=true}
  const ny=e.pos.y+e.vel.y*h;e.onGround=false;
  if(!boxHits(e.pos.x,ny,e.pos.z))e.pos.y=ny;
  else{if(e.vel.y<0){let best=-1e9;const x0=Math.floor(e.pos.x-.3),x1=Math.floor(e.pos.x+.3-1e-6),z0=Math.floor(e.pos.z-.3),z1=Math.floor(e.pos.z+.3-1e-6);
    for(let bx=x0;bx<=x1;bx++)for(let bz=z0;bz<=z1;bz++)for(let by=Math.floor(ny);by<=Math.floor(e.pos.y);by++){const t=getB(bx,by,bz);if(t){const tp=by+topOf(t);if(tp<=e.pos.y+1e-3&&tp>best)best=tp}}
    if(best>-1e9)e.pos.y=best;e.onGround=true}e.vel.y=0}}}

// voxel ray (DDA): the first block along a ray
function ray(o,d,max){let x=Math.floor(o.x),y=Math.floor(o.y),z=Math.floor(o.z);const sx=Math.sign(d.x),sy=Math.sign(d.y),sz=Math.sign(d.z);
 const tdx=d.x?Math.abs(1/d.x):1e30,tdy=d.y?Math.abs(1/d.y):1e30,tdz=d.z?Math.abs(1/d.z):1e30;
 let tx=d.x?(sx>0?x+1-o.x:o.x-x)*tdx:1e30,ty=d.y?(sy>0?y+1-o.y:o.y-y)*tdy:1e30,tz=d.z?(sz>0?z+1-o.z:o.z-z)*tdz:1e30;let nx=0,ny=0,nz=0,t=0;
 for(let i=0;i<80;i++){const b=getB(x,y,z);if(b&&!(isBed(b)&&o.y+d.y*t>y+.56&&ny!==1))return{x,y,z,b,nx,ny,nz,t};
  if(tx<ty&&tx<tz){x+=sx;t=tx;tx+=tdx;nx=-sx;ny=0;nz=0}else if(ty<tz){y+=sy;t=ty;ty+=tdy;nx=0;ny=-sy;nz=0}else{z+=sz;t=tz;tz+=tdz;nx=0;ny=0;nz=-sz}
  if(t>max)return null}return null}
// ray against a character's box -> distance or null
function rayEnt(o,d,e,max){const w=mine(e)?.9:.4,hh=mine(e)?2.6:1.9;const mn=[e.pos.x-w,e.pos.y,e.pos.z-w],mx=[e.pos.x+w,e.pos.y+hh,e.pos.z+w],O=[o.x,o.y,o.z],D=[d.x,d.y,d.z];let t0=0,t1=max;
 for(let i=0;i<3;i++){if(Math.abs(D[i])<1e-9){if(O[i]<mn[i]||O[i]>mx[i])return null;continue}let a=(mn[i]-O[i])/D[i],b=(mx[i]-O[i])/D[i];if(a>b){const q=a;a=b;b=q}t0=Math.max(t0,a);t1=Math.min(t1,b);if(t0>t1)return null}return t0}

function sha256(str){const K=[],H=[];let n=2,c=0;const isP=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true};
 while(c<64){if(isP(n)){if(c<8)H[c]=(Math.pow(n,1/2)*4294967296)|0;K[c]=(Math.pow(n,1/3)*4294967296)|0;c++}n++}
 const b=[...new TextEncoder().encode(str)],l=b.length*8;b.push(128);while(b.length%64!==56)b.push(0);for(let i=7;i>=0;i--)b.push(Math.floor(l/Math.pow(2,i*8))&255);
 const r=(x,y)=>(x>>>y)|(x<<(32-y));
 for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
  for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
  let[a,bb,cc,d,e,f,g,h]=H;
  for(let i=0;i<64;i++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&cc)^(bb&cc)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0}
  [a,bb,cc,d,e,f,g,h].forEach((v,i)=>H[i]=(H[i]+v)|0)}
 return H.map(v=>(v>>>0).toString(16).padStart(8,"0")).join("")}

  if(g.lab&&Math.random()<dt*4){const left=Math.ceil(genEvery(g)-g.t);const c=g.lab.material.map.image.getContext("2d");c.clearRect(0,0,256,64);c.fillStyle="rgba(0,0,0,.45)";c.fillRect(0,8,256,48);c.font="bold 24px Segoe UI, Arial";c.textAlign="center";c.fillStyle=g.kind==="diamond"?"#4fe3e0":"#2fd36b";c.fillText(`${g.kind==="diamond"?"💎 Diamonds":"🟩 Emeralds"} ${g.stock}${isHost()?` · ${left}s`:""}`,128,43);g.lab.material.map.needsUpdate=true}
  if(g.stock>0)for(const e of ENTS){if(!e.alive||!(e.local||(e.bot&&isHost())))continue;if(Math.hypot(e.pos.x-g.x,e.pos.z-g.z)<1.7&&Math.abs(e.pos.y-g.y)<2){e.res[g.kind]+=g.stock;if(e.local){sfx(1200,.04,"triangle",.04);hud()}g.stock=0;g.takenUntil=matchT+.8;send({k:"take",g:i});break}}}
 // bots
 if(isHost())for(const b of ENTS)if(b.bot)botTick(b,dt);

 for(const e of ENTS){if(e.local)continue;if(e.to&&!(e.bot&&isHost())){const old=e.pos.clone();e.pos.lerp(e.to,Math.min(1,dt*12));e.vel.copy(e.pos).sub(old).divideScalar(dt||1)}
  e.kb.multiplyScalar(Math.exp(-6*dt));e.swingT-=dt;if(e.mesh){e.mesh.position.copy(e.pos);e.mesh.rotation.y=e.yaw;animate(e,dt);if(e.bot&&isHost())setHeld(e,e.blocks&&e.blocks.wool&&!nearestEnemy(e,6)?"wool":"sword")}}
 stepProj(dt);
 // send my state, and (host) the bots and generators
 netT-=dt;if(netT<=0&&NET){netT=.08;send({k:"p",x:+P.pos.x.toFixed(2),y:+P.pos.y.toFixed(2),z:+P.pos.z.toFixed(2),yaw:+P.yaw.toFixed(2),pi:+P.pitch.toFixed(2),hp:Math.ceil(P.hp),al:P.alive?1:0,sw:P.sword,ax:P.axe,ar:P.armor,h:heldOf(P),s:P.swingT>.15?1:0});
  if(isHost()){send({k:"b",bots:ENTS.filter(e=>e.bot).map(b=>[b.id,+b.pos.x.toFixed(2),+b.pos.y.toFixed(2),+b.pos.z.toFixed(2),+b.yaw.toFixed(2),Math.ceil(b.hp),b.alive?1:0,b.sword,b.swingT>.15?1:0,b.out?1:0,b.armor,b.heldKind?b.heldKind.replace(/\d+$/,""):"sword"]),g:GENS.map(g=>g.stock)})}}
 P.swingT-=dt;
 // HUD bits
 const n=nearNPC();if(n&&!panelOpen()&&P.alive){$("hint").style.display="block";const what={shop:"item shop",upg:"team upgrades",ender:"your ender chest",tchest:"team chest"}[n.kind];$("hint").textContent=TOUCH?`Tap 🛒 for the ${what}`:`Press E for the ${what}`}else if(P.alive)$("hint").style.display="none";
 if(BIG()){$("raidbtn").style.display=!RAID&&P.alive&&!panelOpen()?"block":"none";if(!RAID&&Math.random()<dt*3&&!nearNPC())$("hint").style.display="block",$("hint").textContent="Get ready: build, buy and place turrets. Press R or the button when you want the bots to attack.";
  if(RAID){const w=Math.min(7,Math.floor((matchT-RAID_T)/25)+1);if(w>waveShown){waveShown=w;if(w>1)msg(`WAVE ${w}`,2,"More bots are coming!");feed(`⚔️ Wave ${w} of 7 is attacking`)}}
  stepTurrets(dt)}
 const mm=Math.floor(matchT/60),ss=Math.floor(matchT%60);$("timer").textContent=`${QNAME[MATCH.q].split(" ·")[0]} · ${mm}:${String(ss).padStart(2,"0")}`;
 if(Math.random()<dt*2)hud();updateView()}

enterLobby();requestAnimationFrame(loop);
