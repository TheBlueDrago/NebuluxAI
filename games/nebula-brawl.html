  if(window.claude&&window.claude.use){ ACC.local=true; ACC.up=true; ACC.p=Promise.resolve(true); clRoomJoin(); const cur=nbGet("nb_cur",""), a=accts().find(x=>x.key===cur); if(a&&!gateMode)return resumeAcct(a,true); return gateAcct(); }
  gateShell('<h2 id="nbh">Sign in</h2><p>Connecting to the game\'s server...</p>');
  acctConnect().then(up=>{ if(!up){ gateOffline(); return; } const cur=nbGet("nb_cur",""), a=accts().find(x=>x.key===cur); if(a&&!gateMode)return resumeAcct(a,true); gateAcct(); });
}
// on claude.ai: a player name (kept on this device) and claude.ai's live room for real players
function gateClaude(){
  gateShell('<h2 id="nbh">Sign in</h2><p>Checking your claude.ai account...</p>');
  const fail=()=>gateShell('<h2 id="nbh">Sign in to claude.ai</h2><p>On claude.ai you play with your own claude.ai account, so nobody else can get into it. Sign in to claude.ai, then open the game again.</p><button class="nbgo" id="nbretry">Try again</button>');
  Promise.resolve(window.claude.use("user")).then(async(u)=>{ let id=null; try{ id=u?await u.id():null; }catch(e){ id=null; }
    if(!id){ fail(); const b=document.getElementById("nbretry"); if(b)b.onclick=gateClaude; return; }
    const key="cl-"+String(id).replace(/[^A-Za-z0-9_-]/g,"").slice(0,40), saved=nbGet("nb_cl_name:"+key,"");
    const enter=(n)=>{ ACC.name=n; ACC.key=key; ACC.offline=true; loadProfileKey(key,null); ensureProfile(); showLobby();
      window.claude.use("room").then(r=>{ if(!r)return; ACC.cl=r; r.onPeers(c=>{ for(const p of c.peers||[])if(p.isMe&&!ACC.peer)ACC.peer=p.peer; }); if(!ACC.peer&&window.__PEER)ACC.peer=window.__PEER; lobbyHere(); }).catch(()=>{}); };
    if(saved)return enter(saved);
    gateShell('<h2 id="nbh">Pick a player name</h2><p>You&#39;re signed in with your claude.ai account, so only you can play as you. Other players see this name.</p><label class="nbi">Player name<input id="nbnm" maxlength="16" autocomplete="nickname" autocapitalize="off" spellcheck="false"></label><button class="nbgo" id="nbgo">Play</button><p class="nber" id="nber" role="alert"></p><button class="nb2" id="nbreread">Read the player agreement again</button>');
    document.getElementById("nbreread").onclick=()=>{ nbSet("nb_agree",""); gate(); };
    const go=()=>{ const n=document.getElementById("nbnm").value.trim().replace(/\s+/g," "), bad=nameProblem(n); if(bad){ document.getElementById("nber").textContent=bad; return; } nbSet("nb_cl_name:"+key,n); enter(n); };
    document.getElementById("nbgo").onclick=go; document.getElementById("nbnm").onkeydown=(e)=>{ if(e.key==="Enter")go(); };
  }).catch(()=>{ fail(); const b=document.getElementById("nbretry"); if(b)b.onclick=gateClaude; });
}
function gateOffline(){
  gateShell('<h2 id="nbh">Can&#39;t reach the game&#39;s server</h2><p>You need your account to play, so the game has to reach its server. Check your connection and try again.</p><button class="nbgo" id="nbretry">Try again</button>');
  document.getElementById("nbretry").onclick=()=>{ ACC.p=null; gate(); };
}
async function resumeAcct(a,quiet){
  gateShell('<h2 id="nbh">Welcome back</h2><p>Signing in as '+escHtml(a.name)+'...</p>');
  try{ const v=await acctCall({op:"resume",sess:a.sess}); await acctEnterGame(v,a.sess); }
  catch(e){ if(e&&e.code==="expired"){ nbSet("nr_accts",accts().filter(x=>x.key!==a.key)); gateMode="login"; gateAcct(a.name,acctErr(e)); } else { gateMode="saved"; gateAcct("",acctErr(e)); } }
}
function gateAcct(nm,err){
  const L=accts(), mode=gateMode||(L.length?"saved":"signup");
  const tabs='<div class="nbtab"><button data-m="login" class="'+(mode==="login"?"on":"")+'">Log in</button><button data-m="signup" class="'+(mode==="signup"?"on":"")+'">Sign up</button></div>';
  let body;
  if(mode==="saved") body='<h2 id="nbh">Welcome back</h2><p>Pick your account.</p>'+L.map(a=>'<button class="nbacc" data-k="'+escHtml(a.key)+'"><span>'+escHtml(a.name.slice(0,1).toUpperCase())+'</span>'+escHtml(a.name)+'</button>').join("")+tabs;
  else body='<h2 id="nbh">'+(mode==="signup"?"Sign up":mode==="recover"?"Forgot your password":"Log in")+'</h2>'+(mode==="recover"?"":tabs)+
    '<label class="nbi">Player name<input id="nbnm" maxlength="16" autocomplete="username" autocapitalize="off" spellcheck="false" value="'+escHtml(nm||"")+'"></label>'+
    (mode==="recover"?'<label class="nbi">Recovery code<input id="nbrc" maxlength="29" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX-XXXXX-XXXXX"></label>':"")+
    '<label class="nbi">'+(mode==="recover"?"New password":"Password")+'<input id="nbpw" type="password" maxlength="64" autocomplete="'+(mode==="login"?"current-password":"new-password")+'"></label>'+
    (mode!=="login"?'<label class="nbi">'+(mode==="recover"?"New password again":"Password again")+'<input id="nbpw2" type="password" maxlength="64" autocomplete="new-password"></label>':"")+
    '<button class="nbgo" id="nbgo">'+(mode==="signup"?"Sign up":mode==="recover"?"Set new password":"Log in")+'</button>'+
    (mode==="login"?'<button class="nb2" data-m="recover">Forgot your password?</button>':mode==="recover"?'<button class="nb2" data-m="login">Back to log in</button>':'')+
    '<p>'+(ACC.local?(mode==="signup"?"Your player name and password are your account in this browser. You'll get a recovery code in case you forget your password.":"Use the name and password of your account in this browser."):(mode==="signup"?"Your player name is your account, for Nebula Brawl and Nebula Royale. You'll get a recovery code in case you forget your password.":"Already have a Nebula Royale account? It works here too."))+'</p>';
  gateShell(body+'<p class="nber" id="nber" role="alert">'+escHtml(err||"")+'</p><button class="nb2" id="nbreread">Read the player agreement again</button>');
  const er=t=>{ const e=document.getElementById("nber"); if(e)e.textContent=t; };
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ const n=document.getElementById("nbnm"); gateMode=b.dataset.m; gateAcct(n?n.value:nm); });
  app.querySelectorAll(".nbacc").forEach(b=>b.onclick=()=>{ const a=accts().find(x=>x.key===b.dataset.k); if(a)resumeAcct(a); });
  document.getElementById("nbreread").onclick=()=>{ nbSet("nb_agree",""); gate(); };
  const go=document.getElementById("nbgo"); if(!go)return;
  const run=async()=>{
    const name=document.getElementById("nbnm").value.trim().replace(/\s+/g," "), pw=document.getElementById("nbpw").value, p2=document.getElementById("nbpw2");
    if(mode==="signup"){ const bad=nameProblem(name); if(bad)return er(bad); }
    else if(!name)return er("Type your player name.");
    if(pw.length<(mode==="login"?1:6))return er(mode==="login"?"Type your password.":"Use at least 6 characters for the password.");
    if(p2&&p2.value!==pw)return er("The two passwords don't match.");
    go.disabled=true; er(mode==="signup"?"Making your account...":"Signing in...");
    try{
      const ph=await pwHash(name,pw);
      const v=mode==="recover"?await acctCall({op:"recover",name,code:String(document.getElementById("nbrc").value).toUpperCase().replace(/[^0-9A-Z]/g,""),ph}):await acctCall({op:mode==="signup"?"reg":"login",name,ph});
      if(v.rec){ showRecovery(v); return; }
      await acctEnterGame(v,v.sess);
    }catch(e){ go.disabled=false; er(acctErr(e)); }
  };
  go.onclick=run; app.querySelectorAll(".nbi input").forEach(i=>i.onkeydown=e=>{ if(e.key==="Enter")run(); });
}
function showRecovery(v){
  const code=String(v.rec).replace(/(.{5})(?=.)/g,"$1-");
  gateShell('<h2 id="nbh">Save your recovery code</h2><p>If you ever forget your password, this code lets you set a new one. Write it down or take a screenshot. It\'s shown only this once.</p><div class="nbcode">'+code+'</div><label class="nbck"><input type="checkbox" id="nbsaved"> I saved my recovery code</label><button class="nbgo" id="nbon" disabled>Continue</button>');
  const c=document.getElementById("nbsaved"), b=document.getElementById("nbon");
  c.onchange=()=>{ b.disabled=!c.checked; }; b.onclick=()=>acctEnterGame(v,v.sess);
}
// ---------- real players: Duel ----------
const NETB={ q:null, room:null, code:null }, NET_MODES=["duel","arena","gem","ranked","ball","showdown","vault","zone","hunt","titan"];
const netOk=()=>!!(ACC.cl?ACC.peer:(ACC.key&&!ACC.offline&&ACC.up&&ACC.peer));
function duelQueue(){
  if(NETB.q)return;
  NETB.q={ qt:Date.now()+Math.random(), go:null, t0:performance.now(), md:appMode }; if(NETB.code==null)NETB.code=nbGet("nb_party","")||null;
  const ov=el('<div id="duelq" role="dialog" aria-label="Looking for a real player" style="position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(5,3,20,.72)"><div class="nbb" style="text-align:center">'+GATE_CSS+'<h2>'+MODE_INFO[appMode].name+' · real players</h2><p id="duelqs">Looking for another player...</p><div id="duelparty" style="margin:.5rem 0"></div><button class="nbgo" id="duelbot">Play the computer instead</button><button class="nb2" id="duelx">Cancel</button></div></div>');
  document.body.appendChild(ov);
  ov.querySelector("#duelbot").onclick=()=>{ duelCancel(); NETB.skip=true; startMatch(); };
  ov.querySelector("#duelx").onclick=duelCancel;
  partyUi();
  const LR=ROOMS.get("nr-brawl"); if(LR)LR.on=duelTick; else roomJoin("nr-brawl",duelTick); duelPres(); NETB.iv=setInterval(duelTick,500);
}
// signed in and in the lobby: stay in the lobby room, so the lobby can show how many people are playing Nebula Brawl right now
function lobbyHere(){ if(NETB.q){ onlineCount(); return; } if(!netOk()&&!(ACC.cl||(ACC.key&&!ACC.offline)))return; let R=ROOMS.get("nr-brawl"); if(!R)R=roomJoin("nr-brawl",onlineCount); else R.on=onlineCount; roomPres("nr-brawl",{v:2,nm:ACC.name,st:"l"}); onlineCount(); }
function onlineCount(){ const R=ROOMS.get("nr-brawl"), el=document.getElementById("pill-online"); if(!el)return; const n=R?[...R.peers.values()].filter(d=>d&&d.v===2).length+1:0; el.style.display=n>1?"":"none"; el.textContent=n+" online"; }
// the party code box: make a code, type a friend's, or clear it
function partyUi(){
  const box=document.getElementById("duelparty"); if(!box)return;
  if(NETB.code){ box.innerHTML='<p style="margin:0">Party code <b style="font-size:20px;letter-spacing:.12em;color:#fde047">'+NETB.code+'</b><br>Friends who press Play with this code join your match.</p><button class="nb2" id="partyoff">Play with anyone instead</button>'; box.querySelector("#partyoff").onclick=()=>{ NETB.code=null; nbSet("nb_party",""); partyUi(); duelPres(); }; return; }
  box.innerHTML='<p style="margin:0 0 .25rem">Playing with friends?</p><div style="display:flex;gap:.375rem"><input id="partyin" maxlength="4" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="CODE" aria-label="Party code" style="flex:1;min-height:44px;border-radius:.75rem;border:0;padding:0 .75rem;font-size:18px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;background:#f5f3ff;color:#1e1b4b"><button class="nb2" id="partyjoin" style="width:auto;margin:0;padding:0 .75rem;background:rgba(255,255,255,.1)">Join</button></div><button class="nb2" id="partynew">Make a party code</button>';
  const set=(c)=>{ c=String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4); if(c.length<4)return; NETB.code=c; nbSet("nb_party",c); partyUi(); duelPres(); if(NETB.q){ NETB.q.fillAt=0; } };
  box.querySelector("#partynew").onclick=()=>{ const A="ABCDEFGHJKMNPQRSTVWXYZ23456789"; let c=""; const b=new Uint8Array(4); crypto.getRandomValues(b); for(const x of b)c+=A[x%A.length]; set(c); };
  box.querySelector("#partyjoin").onclick=()=>set(box.querySelector("#partyin").value);
  box.querySelector("#partyin").onkeydown=(e)=>{ if(e.key==="Enter")set(e.target.value); };
}
function duelPres(){ if(!NETB.q)return; roomPres("nr-brawl",{v:2,nm:ACC.name,st:"q",md:NETB.q.md,cd:NETB.code||null,qt:NETB.q.qt,def:profile.selectedBrawler,lv:levelOf(profile.selectedBrawler),go:NETB.q.go}); }
function duelCancel(){ clearInterval(NETB.iv); NETB.q=null; lobbyHere(); const o=document.getElementById("duelq"); if(o)o.remove(); }
// which host places real players take: Duel the rival, Titan Raid the crew, 3v3 alternating crews
const slotsFor=(md)=>md==="duel"?[3]:md==="titan"?[1,2]:[3,1,4,2,5];
// a guest in host place s: where each of the host's fighters goes in the guest's own match, and whether it's turned round
function netMapFor(s){ const t=s<3?0:1, mine=[0,1,2].map(k=>k+t*3), oth=[0,1,2].map(k=>k+(1-t)*3), order=[s,...mine.filter(k=>k!==s),...oth], L=[]; order.forEach((h,l)=>{ L[h]=l; }); return { L, mir:t===1 }; }
function duelTick(){
  const Q=NETB.q, R=ROOMS.get("nr-brawl"); if(!Q||!R)return;
  const st=document.getElementById("duelqs"), cd=NETB.code||null, others=[...R.peers].filter(([p,d])=>d&&d.v===2&&((d.st!=="q"&&d.st!=="m")||(d.cd||null)===cd));
  const busy=others.filter(([p,d])=>d.st==="m"&&d.md===Q.md).length;
  if(st)st.textContent=busy?busy+" player"+(busy===1?" is":"s are")+" in a "+MODE_INFO[Q.md].name+" match right now. Stay here: when it ends and they play again, you'll be matched with them.":others.length?"Found "+others.length+" other player"+(others.length===1?"":"s")+" online...":"Looking for another player... ("+Math.round((performance.now()-Q.t0)/1000)+"s)";
  for(const [p,d] of others) if(d.go&&Array.isArray(d.go.g)&&d.go.g.includes(ACC.peer)&&d.md===Q.md) return duelStart("guest",p,d,d.go);
  if(Q.go)return;
  const qs=others.filter(([p,d])=>d.st==="q"&&d.md===Q.md&&!d.go).sort((a,b)=>a[1].qt-b[1].qt);
  if(!qs.length||Q.qt>qs[0][1].qt){ Q.fillAt=0; return; }
  // friends with a party code play on the same crew first; everyone else alternates crews
  const sl=NETB.code&&Q.md!=="duel"&&Q.md!=="titan"?[1,2,3,4,5]:slotsFor(Q.md), cap=sl.length;
  if(!Q.fillAt)Q.fillAt=performance.now()+(cap>1&&qs.length<cap?5000:0);
  if(performance.now()<Q.fillAt&&qs.length<cap){ if(st)st.textContent=qs.length+" other player"+(qs.length===1?"":"s")+" found. Starting in "+Math.ceil((Q.fillAt-performance.now())/1000)+"s..."; return; }
  const take=qs.slice(0,cap), slots=sl.slice(0,take.length);
  refreshMaps(); const su=buildSetup(brawlerById(profile.selectedBrawler),Q.md);
  const all=[su.playerDef,...su.blueMateDefs,...su.redDefs], nm=[ACC.name,...su.blueMateNames,...su.redNames];
  take.forEach(([p,d],k)=>{ all[slots[k]]=brawlerById(d.def||"nebula"); nm[slots[k]]=String(d.nm||"Player").slice(0,16); });
  su.blueMateDefs=[all[1],all[2]]; su.blueMateNames=[nm[1],nm[2]]; su.redDefs=[all[3],all[4],all[5]]; su.redNames=[nm[3],nm[4],nm[5]];
  Q.su=su; Q.go={ id:Math.random().toString(36).slice(2,10), g:take.map(x=>x[0]), sl:slots, map:su.map|0, defs:all.map(x=>x.id), names:nm };
  duelPres(); setTimeout(()=>{ NETB.lastSu=Q.su; duelStart("host",null,{md:Q.md},Q.go); },700);
}
function duelStart(role,peer,d,go){
  if(!NETB.q)return;
  clearInterval(NETB.iv); const o=document.getElementById("duelq"); if(o)o.remove();
  const md=d.md||"duel"; appMode=md; refreshMaps();
  const room="nr-b"+go.id; NETB.q=null; setTimeout(()=>{ if(!NETB.q)roomPres("nr-brawl",{v:2,nm:ACC.name,st:"m",md,cd:NETB.code||null}); },1500);
  roomJoin(room,null); roomPres(room,{v:2,nm:ACC.name,role});
  let setup;
  if(role==="host"){
    setup=NETB.lastSu||buildSetup(brawlerById(profile.selectedBrawler),md);
    setup.net={ role, room, guests:go.g.map((p,k)=>({ peer:p, slot:go.sl[k], seen:performance.now(), gone:false })), humans:go.sl.map(sl=>go.names[sl]) };
  } else {
    const s=go.sl[go.g.indexOf(ACC.peer)], mp=netMapFor(s), D=go.defs.map(x=>brawlerById(x)), N=go.names, Dl=[], Nl=[];
    D.forEach((x,h)=>{ Dl[mp.L[h]]=x; Nl[mp.L[h]]=N[h]; });
    setup=buildSetup(brawlerById(profile.selectedBrawler),md);
    setup.blueMateDefs=[Dl[1],Dl[2]]; setup.blueMateNames=[Nl[1],Nl[2]]; setup.redDefs=[Dl[3],Dl[4],Dl[5]]; setup.redNames=[Nl[3],Nl[4],Nl[5]];
    setup.map=go.map|0; setup.foeLevel=Math.max(1,d.lv|0);
    setup.net={ role, room, other:peer, slot:s, L:mp.L, mir:mp.mir, humans:[N[0],...go.sl.filter(sl=>sl!==s).map(sl=>N[sl])] };
  }
  NETB.lastSu=null;
  currentSetup=setup; currentResult=null; recordedResult=false; showLoading();
}
function signOut(){
  clearTimeout(ACC.pushT); roomLeave("nr-brawl");
  const done=()=>{ ACC.uid=null; ACC.key=null; ACC.name=null; ACC.sess=null; nbSet("nb_cur",""); gateMode="saved"; loadProfileKey("guest",null); gate(); };
  if(ACC.key&&!ACC.offline&&ACC.uid){ acctCall({op:"set",path:savePath(),data:{p:profile,name:ACC.name,at:profile.at||Date.now()}}).then(done,done); } else done();
}
function accountSheet(){
  if(document.getElementById("nbsheet"))return;
  const signed=!!(ACC.key&&!ACC.offline&&ACC.uid);
  const where=!signed?"Playing on this device only. Sign in to save your progress.":ACC.local?"Your player name and password are your account in this browser. Your progress is saved here.":"Your progress is saved on this device and online. Log in with this name on any device to keep playing, in Nebula Brawl or Nebula Royale.";
  const pwBox=(id,l,ac)=>'<label class="nbi">'+l+'<input id="'+id+'" type="password" maxlength="64" autocomplete="'+ac+'"></label>';
  const d=el('<div id="nbsheet" class="sheet-backdrop nbgate" style="position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(5,3,20,.6);padding:1rem;overflow:auto"><div class="nbb" role="dialog" aria-label="Your account" style="margin:auto">'+GATE_CSS+GATE_CSS2+'<h2>'+escHtml(ACC.name||"Player")+'</h2><p>'+where+'</p>'+
    (signed?'<div class="nbtab" style="margin-top:.75rem"><button data-a="pw">Change password</button><button data-a="rec">New recovery code</button></div><div id="nbacf"></div>':"")+
    (signed?'<button class="nb2" id="nbout" style="margin-top:.75rem;border:1.5px solid rgba(255,255,255,.18);color:#fda4af">Sign out</button>':'<button class="nbgo" id="nbout">Sign in</button>')+'<button class="nb2" id="nbclose">Close</button></div></div>');
  document.body.appendChild(d);
  const close=()=>d.remove(); d.addEventListener("click",e=>{ if(e.target===d)close(); });
  d.querySelector("#nbclose").onclick=close; d.querySelector("#nbout").onclick=()=>{ close(); ACC.p=ACC.up?ACC.p:null; signOut(); };
  d.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    d.querySelectorAll("[data-a]").forEach(x=>x.classList.toggle("on",x===b));
    const pw=b.dataset.a==="pw", f=d.querySelector("#nbacf");
    f.innerHTML=pwBox("nbold","Current password","current-password")+(pw?pwBox("nbnew","New password","new-password")+pwBox("nbnew2","New password again","new-password"):"")+'<button class="nbgo" id="nbacgo">'+(pw?"Save new password":"Make a new code")+'</button><p class="nber" id="nbacer" role="alert"></p>';
    const er=t=>{ const e=d.querySelector("#nbacer"); if(e)e.textContent=t; };
    d.querySelector("#nbacgo").onclick=async()=>{
      const old=d.querySelector("#nbold").value; if(!old)return er("Type your current password.");
      if(pw){ const n=d.querySelector("#nbnew").value; if(n.length<6)return er("Use at least 6 characters for the new password."); if(n!==d.querySelector("#nbnew2").value)return er("The two new passwords don't match."); }
      const go=d.querySelector("#nbacgo"); go.disabled=true; er(pw?"Saving...":"Making a new code...");
      try{
        const oh=await pwHash(ACC.name,old);
        if(pw){ await acctCall({op:"pw",old:oh,ph:await pwHash(ACC.name,d.querySelector("#nbnew").value)}); f.innerHTML='<p style="color:#86efac;font-weight:800">Your password is changed.</p>'; }
        else{ const v=await acctCall({op:"newrec",old:oh}); f.innerHTML='<p>Your new recovery code. The old one no longer works. Save it somewhere safe: it is shown only this once.</p><div class="nbcode">'+escHtml(String(v.rec||"").replace(/(.{5})(?=.)/g,"$1-"))+'</div>'; }
      }catch(e){ go.disabled=false; er(acctErr(e)); }
    };
  });
}
document.addEventListener("click",e=>{ const b=e.target&&e.target.closest&&e.target.closest("#player-chip"); if(b)accountSheet(); });

// ---------- boot ----------
// Lobby rebuild on rotation/resize only when no sheet is open, so the
// fit-to-screen sizing (hero size, compact rows) always matches the
// current viewport.
let resizeTimer=0;
window.addEventListener("resize",()=>{
  window.clearTimeout(resizeTimer);
  resizeTimer=window.setTimeout(()=>{
    if(sheetOpen)return;
    if(app.querySelector(".lobby-wrap"))showLobby();
  },220);
});
if(/[?&]test(&|=|$)/.test(location.search)&&!/[?&]signin(&|=|$)/.test(location.search)){ ACC.name="Tester"; showLobby(); } else gate();
