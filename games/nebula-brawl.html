<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>Nebula Brawl</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#141033; --deep:#0d0a24; --surface:#241a52; --surface2:#2a1e63;
    --grad-a:#3b2a7d; --grad-b:#241a52; --rail-a:#53419f; --rail-b:#2a1e63;
    --text:#f5f3ff; --dim:#b7aee6; --violet:#7c3aed;
    color-scheme: dark;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); overscroll-behavior:none; }
  body{ font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--text); }
  .font-display{ font-family:"Bungee","Arial Black",system-ui,sans-serif; }
  button{ font-family:inherit; cursor:pointer; min-height:2rem; }
  input{ min-height:2rem; }

  /* Chunky game-button press feel */
  .btn-chunk{
    box-shadow:0 7px 0 rgba(10,6,32,.55), inset 0 -6px 0 rgba(0,0,0,.22), inset 0 3px 0 rgba(255,255,255,.45), inset 3px 0 0 rgba(255,255,255,.12), inset -3px 0 0 rgba(0,0,0,.1);
    text-shadow:0 2px 0 rgba(10,6,32,.25);
    transition:transform .07s ease, box-shadow .07s ease, filter .15s ease;
    border:none; color:#fff;
  }
  .btn-chunk:hover{ filter:brightness(1.07); }
  .btn-chunk:active{ transform:translateY(5px) scale(.98); box-shadow:0 2px 0 rgba(10,6,32,.55), inset 0 -2px 0 rgba(0,0,0,.18), inset 0 3px 0 rgba(255,255,255,.3); }

  /* PLAY button shine sweep */
  .btn-play{ position:relative; overflow:hidden; isolation:isolate; }
  .btn-play::after{ content:""; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(115deg, transparent 32%, rgba(255,255,255,.5) 50%, transparent 68%);
    transform:translateX(-110%); animation:play-shine 3.4s ease-in-out infinite; }
  @keyframes play-shine{ 0%,55%{ transform:translateX(-110%);} 85%,100%{ transform:translateX(110%);} }

  @keyframes floaty{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-8px);} }
  .animate-floaty{ animation:floaty 3.2s ease-in-out infinite; }
  @keyframes pop-in{ 0%{ transform:scale(.6); opacity:0;} 70%{ transform:scale(1.06); opacity:1;} 100%{ transform:scale(1); opacity:1;} }
  .animate-pop-in{ animation:pop-in .35s ease both; }
  @keyframes count-zoom{ 0%{ transform:scale(1.7); opacity:0;} 35%{ transform:scale(1); opacity:1;} 100%{ transform:scale(.92); opacity:1;} }
  .animate-count{ animation:count-zoom .9s ease both; }
  @keyframes spin-slow{ from{ transform:translate(-50%,-50%) rotate(0deg);} to{ transform:translate(-50%,-50%) rotate(360deg);} }
  .animate-spin-slow{ animation:spin-slow 26s linear infinite; }
  @keyframes phone-turn{ 0%,18%{ transform:rotate(0deg);} 48%,82%{ transform:rotate(90deg);} 100%{ transform:rotate(90deg) scale(.92); opacity:.55;} }
  .animate-phone-turn{ animation:phone-turn 2.4s ease-in-out infinite alternate; transform-origin:center; }
  @keyframes wiggle-hint{ 0%,100%{ transform:translateX(0);} 25%{ transform:translateX(-5px);} 75%{ transform:translateX(5px);} }
  .animate-wiggle{ animation:wiggle-hint .9s ease-in-out infinite; }
  @keyframes banner-bounce{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.12);} }
  .animate-banner{ animation:banner-bounce .5s ease-in-out 2; }
  @keyframes pulse-red{ 0%,100%{ opacity:.55;} 50%{ opacity:1;} }
  @keyframes ping-soft{ 0%{ transform:scale(1); opacity:.5;} 80%,100%{ transform:scale(1.45); opacity:0;} }
  .animate-ping-soft{ animation:ping-soft 1.1s cubic-bezier(0,0,.2,1) infinite; }
  @media (prefers-reduced-motion: reduce){
    .animate-floaty,.animate-pop-in,.animate-count,.animate-phone-turn,.animate-wiggle,.animate-spin-slow,.btn-play::after{ animation:none; }
  }

  .screen{ position:fixed; inset:0; overflow:hidden; background:var(--bg); color:#fff; }
  .pt-safe{ padding-top:env(safe-area-inset-top,0px); }
  .pb-safe{ padding-bottom:env(safe-area-inset-bottom,0px); }

  /* Layered space backdrop (stands in for the lobby wallpaper art) */
  .space-bg{ position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(ellipse 60% 34% at 50% 108%, rgba(124,58,237,.5), transparent 70%),
      radial-gradient(circle 340px at 82% 16%, rgba(56,189,248,.16), transparent 70%),
      radial-gradient(circle 260px at 12% 26%, rgba(217,70,239,.13), transparent 70%),
      linear-gradient(180deg, #1b1450 0%, #141033 55%, #100b29 100%);
  }
  .space-bg-dim{ opacity:.55; }
  .ground-band{ position:absolute; inset-inline:0; bottom:0; height:38%; pointer-events:none;
    background:linear-gradient(to top, #241a52, rgba(46,33,102,.85) 55%, transparent); }
  .star-canvas{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  /* Lobby layout */
  .lobby-wrap{ position:relative; margin:0 auto; display:flex; height:100%; width:100%; max-width:72rem; flex-direction:column; padding:0 .75rem .75rem; }
  @media (min-width:640px){ .lobby-wrap{ padding-inline:1rem; } }
  .topbar{ display:flex; align-items:flex-start; gap:.5rem; padding-top:.75rem; }
  .player-chip{ display:flex; align-items:center; gap:.5rem; border-radius:1rem; background:rgba(13,10,36,.85); padding:.375rem .75rem .375rem .375rem; box-shadow:inset 0 0 0 2px rgba(255,255,255,.25); }
  .player-avatar{ position:relative; display:flex; height:2.75rem; width:2.75rem; align-items:center; justify-content:center; border-radius:.75rem;
    background:linear-gradient(180deg,#a78bfa,#6d28d9); box-shadow:inset 0 0 0 2px rgba(255,255,255,.6); font-size:1.125rem; }
  .player-level{ position:absolute; bottom:-.375rem; right:-.375rem; display:flex; height:1.25rem; min-width:1.25rem; align-items:center; justify-content:center;
    border-radius:999px; background:#22d3ee; padding:0 .25rem; font-size:10px; font-weight:900; color:#083344; box-shadow:0 0 0 2px #141033; }
  .pill{ display:flex; align-items:center; gap:.375rem; border-radius:999px; background:rgba(13,10,36,.85); padding:.5rem .75rem; font-size:.875rem; font-weight:900; box-shadow:inset 0 0 0 2px rgba(255,255,255,.25); white-space:nowrap; }
  .pill .sub{ font-size:10px; font-weight:700; text-transform:uppercase; color:#c4b5fd; }
  .middle{ position:relative; display:flex; flex:1; min-height:0; align-items:center; justify-content:center; padding:.5rem 0; }
  .rail{ position:absolute; top:50%; transform:translateY(-50%); z-index:10; display:flex; flex-direction:column; gap:.625rem; }
  .rail-left{ left:0; } .rail-right{ right:0; }
  /* narrow upright phones: the aim stick in the corner, the action buttons in rows above it, the pin beside it */
  @media (max-width:519px){
    #stick-move, #stick-aim{ width:clamp(6.5rem,31vmin,9rem)!important; height:clamp(6.5rem,31vmin,9rem)!important; }
    #ctl-right{ width:clamp(6.5rem,31vmin,9rem); flex-wrap:wrap-reverse; justify-content:flex-end; align-items:flex-end; gap:.375rem!important; margin-right:.375rem!important; }
    #ctl-right > #stick-aim{ order:-1; }
    #ctl-right > .round-btn{ margin:0!important; }
    #ctl-right > #btn-auto{ height:2.75rem!important; width:2.75rem!important; }
    #ctl-right > #btn-super{ height:3.75rem!important; width:3.75rem!important; }
    #ctl-right > #btn-hyper, #ctl-right > #btn-gadget{ height:2.75rem!important; width:2.75rem!important; }
    #ctl-right > #btn-pin{ right:auto!important; left:-3.25rem; bottom:.25rem!important; }
  }
  /* very short sideways screens: the pin goes left of the action buttons, clear of the exit button */
  @media (max-height:340px) and (min-width:520px){ #ctl-right > #btn-pin{ right:calc(100% + .5rem)!important; bottom:2.5rem!important; } }
  .rail-xs .rail-label{ display:none; } .rail-xs .rail-btn{ width:2.75rem; min-height:2.75rem; justify-content:center; }
  .rail-sm{ gap:.375rem; } .rail-sm .rail-btn{ padding:.3rem .2rem; } .rail-sm .rail-btn svg{ width:18px; height:18px; }
  .rail-btn{ display:flex; width:3.5rem; flex-direction:column; align-items:center; gap:.25rem; border-radius:1rem;
    background:linear-gradient(180deg,var(--rail-a),var(--rail-b)); padding:.5rem .125rem; box-shadow:inset 0 0 0 2px rgba(255,255,255,.3), 0 7px 0 rgba(10,6,32,.55), inset 0 -6px 0 rgba(0,0,0,.22), inset 0 3px 0 rgba(255,255,255,.45); }
  @media (min-width:640px){ .rail-btn{ width:4rem; padding:.625rem .25rem; } }
  .rail-btn .rail-label{ text-align:center; font-size:7.5px; font-weight:900; text-transform:uppercase; line-height:1.15; letter-spacing:0; color:#ede9fe; max-width:100%; white-space:normal; overflow-wrap:normal; }
  @media (min-width:640px){ .rail-btn .rail-label{ font-size:8.5px; } }
  .hero-col{ position:relative; display:flex; max-width:100%; flex-direction:column; align-items:center; padding:0 4rem; }
  @media (min-width:640px){ .hero-col{ padding:0 5rem; } }
  .cycle-btn{ position:absolute; top:50%; z-index:10; display:flex; height:2.75rem; width:2.75rem; transform:translateY(-50%); align-items:center; justify-content:center;
    border-radius:999px; background:linear-gradient(180deg,var(--rail-a),var(--rail-b)); font-size:1.25rem; color:#fff; box-shadow:inset 0 0 0 2px rgba(255,255,255,.4), 0 7px 0 rgba(10,6,32,.55); border:none; }
  .cycle-btn:active{ transform:translateY(calc(-50% + 5px)) scale(.98); }
  .name-plate{ transform:rotate(-1deg); border-radius:1rem; background:linear-gradient(180deg,var(--grad-a),var(--grad-b)); padding:.375rem 1.25rem; box-shadow:inset 0 0 0 2px rgba(255,255,255,.35); }
  .name-plate h1{ margin:0; text-align:center; line-height:1; letter-spacing:.02em; color:#fff; text-shadow:0 3px 0 rgba(10,6,32,.6); font-size:34px; }
  .badge{ white-space:nowrap; border-radius:999px; padding:.125rem .625rem; font-size:11px; font-weight:900; text-transform:uppercase; letter-spacing:.03em; color:#141033; }
  .count-badge{ white-space:nowrap; border-radius:999px; background:rgba(255,255,255,.1); padding:.125rem .5rem; font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.03em; color:#ddd6fe; box-shadow:inset 0 0 0 1px rgba(255,255,255,.25); }
  .stat-pill{ border-radius:999px; padding:.25rem .625rem; font-size:11px; font-weight:700; background:rgba(36,26,82,.9); color:#ede9fe; box-shadow:inset 0 0 0 1px rgba(255,255,255,.25); white-space:nowrap; }
  .stat-pill .lab{ color:#c4b5fd; }
  .stat-pill.accent{ background:rgba(250,204,21,.9); font-weight:900; color:#451a03; box-shadow:inset 0 0 0 1px #fef08a; }
  .stat-pill.accent .lab{ color:#451a03; }
  .rank-bar{ height:.625rem; overflow:hidden; border-radius:999px; background:rgba(0,0,0,.5); box-shadow:inset 0 0 0 1px rgba(255,255,255,.25); }
  .rank-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg,#fcd34d,#facc15); transition:width .5s ease; }
  .bottom-row{ margin-top:.25rem; display:flex; align-items:stretch; gap:.75rem; }
  .mode-card{ display:flex; flex:1; min-width:0; align-items:center; gap:.75rem; border-radius:1.5rem; text-align:left;
    background:linear-gradient(180deg,var(--grad-a),var(--grad-b)); padding:.75rem; box-shadow:inset 0 0 0 2px rgba(255,255,255,.25), 0 7px 0 rgba(10,6,32,.55), inset 0 -6px 0 rgba(0,0,0,.22), inset 0 3px 0 rgba(255,255,255,.45); }
  .mode-thumb{ display:none; height:4rem; width:4rem; flex-shrink:0; align-items:center; justify-content:center; border-radius:1rem; box-shadow:inset 0 0 0 2px rgba(255,255,255,.3); }
  @media (min-width:420px){ .mode-thumb{ display:flex; } }
  .play-btn{ width:9rem; flex-shrink:0; border-radius:1.5rem; font-size:2.25rem; line-height:1;
    background:linear-gradient(180deg,#fde047,#fbbf24 55%,#f59e0b); color:#451a03; box-shadow:inset 0 0 0 4px rgba(254,240,138,.7), 0 7px 0 rgba(10,6,32,.55), inset 0 -6px 0 rgba(0,0,0,.22), inset 0 3px 0 rgba(255,255,255,.45); }
  @media (min-width:640px){ .play-btn{ width:13rem; } }
  .clamp2{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  /* Sheets */
  .sheet{ position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; background:rgba(23,16,56,.97); backdrop-filter:blur(4px); }
  .sheet-inner{ margin:0 auto; display:flex; width:100%; flex:1; min-height:0; flex-direction:column; padding:0 1rem 1.5rem; }
  /* long sheets scroll instead of running off the screen; bigger tap targets */
  .sheet-body{ overflow-y:auto; overscroll-behavior:contain; }
  .chip-filter{ min-height:40px; }
  .sheet-close{ min-width:44px; min-height:44px; }
  .sheet-close{ margin-left:auto; display:flex; height:2.5rem; width:2.5rem; align-items:center; justify-content:center; border-radius:999px; background:rgba(255,255,255,.1); font-size:1.125rem; color:#fff; box-shadow:inset 0 0 0 1px rgba(255,255,255,.3); border:none; }
  .sheet-close:active{ transform:scale(.95); }
  .card-btn{ display:flex; width:86px; flex-shrink:0; flex-direction:column; border-radius:1rem; padding:.375rem; border:none; text-align:center; transition:transform .1s; }
  .card-btn:active{ transform:scale(.95); }
  .chip-filter{ border-radius:999px; padding:.375rem .75rem; font-size:.75rem; font-weight:900; border:none; }
  .chip-filter:active{ transform:scale(.95); }
  .mode-pick{ display:flex; align-items:center; gap:.75rem; border-radius:1.5rem; padding:1rem; text-align:left; width:100%; }

  /* Loading */
  .tip-card{ border-radius:1.5rem; background:rgba(13,10,36,.8); padding:.875rem; box-shadow:inset 0 0 0 1px rgba(255,255,255,.25); backdrop-filter:blur(2px); }
  .load-track{ height:1.75rem; overflow:hidden; border-radius:999px; background:rgba(13,10,36,.9); box-shadow:inset 0 0 0 2px rgba(255,255,255,.6); position:relative; }
  .load-fill{ position:relative; display:flex; height:100%; align-items:center; justify-content:flex-end; overflow:hidden; border-radius:999px;
    background:linear-gradient(90deg,#7c3aed,#e879f9,#22d3ee); padding-right:.5rem; transition:width .1s linear; }

  /* Versus */
  .team-card{ width:31%; max-width:150px; border-radius:1.5rem; background:rgba(36,26,82,.9); padding:.5rem; }

  /* Game HUD */
  .hud-pill{ display:flex; align-items:center; gap:.375rem; border-radius:999px; background:rgba(13,10,36,.8); padding:.25rem .75rem; }
  .stick-zone{ position:relative; touch-action:none; user-select:none; -webkit-user-select:none; flex-shrink:0; }
  .stick-base{ pointer-events:none; position:absolute; border-radius:999px; border:2px solid; transform:translate(-50%,-50%); transition:opacity .15s; }
  .stick-knob{ position:absolute; border-radius:999px; left:50%; top:50%; }
  .ammo-pip{ height:.625rem; width:1.75rem; border-radius:999px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.4); }
  .round-btn{ display:flex; align-items:center; justify-content:center; border-radius:999px; border:none; color:#fff; }
  .hidden{ display:none !important; }
</style>
</head>

// ---------- tiny utils ----------

const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function hashCode(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}
function mulberry32(seed){let a=seed>>>0;return()=>{a|=0;a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}

const ARCHETYPES=[

function generateRoster(count){
  const out=[]; const usedNames=new Set(FEATURED.map(b=>b.name));
  const rng=mulberry32(20261113); let ai=0,bi=0,n=0;
  while(out.length<count){
    const a=NAME_A[ai%NAME_A.length]; const b=NAME_B[bi%NAME_B.length];
    ai+=1; if(ai%NAME_A.length===0)bi+=1;
    const name=a+b; if(usedNames.has(name))continue; usedNames.add(name);
    const arch=ARCHETYPES[n%ARCHETYPES.length];
    const vary=0.92+rng()*0.16;
    const rarity=RARITY_CYCLE[n%RARITY_CYCLE.length];
    const title=TITLES[Math.floor(rng()*TITLES.length)];
    out.push({
      id:"brawler-"+(n+1), name, title:title+" · "+arch.title,
      desc:name+" fights with a "+arch.weapon+". "+arch.blurb+" Super: "+arch.superName+".",
      hp:Math.round((arch.hp*vary)/10)*10,
      speed:Math.round(arch.speed*(0.95+rng()*0.1)),
      radius:arch.radius, damage:Math.round((arch.damage*vary)/5)*5,
      range:Math.round(arch.range*(0.95+rng()*0.1)),
      bulletSpeed:arch.bulletSpeed, fireRate:arch.fireRate, pellets:arch.pellets,
      spreadDeg:arch.spreadDeg, reloadTime:arch.reloadTime, maxAmmo:3,
      superChargeHits:arch.superChargeHits, superKind:arch.superKind,
      superName:arch.superName, superDesc:arch.superDesc, atk:arch.atk||"shot",
      suit:SUITS[(n*7+Math.floor(rng()*3))%SUITS.length],
      trim:TRIMS[(n*5+Math.floor(rng()*3))%TRIMS.length],
      skin:SKINS[(n+Math.floor(rng()*2))%SKINS.length],
      hair:HAIRS[(n*3+Math.floor(rng()*3))%HAIRS.length],
      hairStyle:HAIR_STYLES[n%HAIR_STYLES.length],
      pattern:PATTERNS[n%PATTERNS.length],
      accessory:ACCESSORIES[Math.floor(n/2)%ACCESSORIES.length],
      rarity
    });
    n+=1;
  }
  return out;
}

function openPod(){

  const roll=Math.random(), sure=profile.podsOpened%6===0;
  const odds=[["Legendary",0.006],["Mythic",0.02],["Epic",0.05],["Super Rare",0.11],["Rare",0.23]];
  let out=null;
  for(const [rar,p] of odds){ if(roll<p){ const b=BRAWLERS.find(x=>!owns(x.id)&&x.rarity===rar); if(b){ unlockBrawler(b.id); out={kind:"brawler",def:b}; } break; } }
  if(!out&&sure){ const b=nextLocked(1); if(b){ unlockBrawler(b.id); out={kind:"brawler",def:b}; } }
  if(!out){ const n=50+Math.floor(Math.random()*11)*10; profile.coins+=n; out={kind:"coins",n}; }
  saveProfile(); return out;
}

function inRect(x,y,r,pad){pad=pad||0;return x>=r.x-pad&&x<=r.x+r.w+pad&&y>=r.y-pad&&y<=r.y+r.h+pad;}
function isInBush(x,y){return BUSHES.some(b=>inRect(x,y,b));}
function solidBoxes(cratesAlive){
  const boxes=WALLS.map(w=>({...w,kind:"wall",crateIndex:-1}));
  CRATES.forEach((c,i)=>{ if(cratesAlive[i]) boxes.push({x:c.x-TILE/2+6,y:c.y-TILE/2+6,w:TILE-12,h:TILE-12,kind:"crate",crateIndex:i}); });
  return boxes;
}
function collideCircle(pos,radius,boxes){
  let x=Math.max(radius,Math.min(WORLD_W-radius,pos.x));
  let y=Math.max(radius,Math.min(WORLD_H-radius,pos.y));
  for(const b of boxes){
    const nx=Math.max(b.x,Math.min(x,b.x+b.w));
    const ny=Math.max(b.y,Math.min(y,b.y+b.h));
    const dx=x-nx, dy=y-ny, d2=dx*dx+dy*dy;
    if(d2<radius*radius){
      if(d2>0.0001){ const d=Math.sqrt(d2); x=nx+(dx/d)*radius; y=ny+(dy/d)*radius; }
      else{
        const left=x-b.x, right=b.x+b.w-x, top=y-b.y, bottom=b.y+b.h-y;
        const m=Math.min(left,right,top,bottom);
        if(m===left)x=b.x-radius; else if(m===right)x=b.x+b.w+radius; else if(m===top)y=b.y-radius; else y=b.y+b.h+radius;
      }
    }
  }
  return {x,y};
}
function segmentBlocked(x0,y0,x1,y1,boxes){
  const steps=Math.max(2,Math.ceil(Math.hypot(x1-x0,y1-y0)/8));
  for(let i=1;i<=steps;i++){ const t=i/steps, x=x0+(x1-x0)*t, y=y0+(y1-y0)*t;
    for(const b of boxes){ if(inRect(x,y,b)) return b; } }
  return null;
}
function lineOfSight(a,b,boxes){ return segmentBlocked(a.x,a.y,b.x,b.y,boxes)===null; }

// Canvas drawing for one brawler: a chunky round space-helmet
// fighter. Used by the match renderer and every menu screen, so a
// brawler looks the same everywhere. All-original vector art.

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawTinyStar(ctx,cx,cy,r){
  ctx.beginPath();
  for(let i=0;i<10;i++){ const rad=i%2===0?r:r*0.45; const a=-Math.PI/2+(i*Math.PI)/5;
    const px=cx+Math.cos(a)*rad, py=cy+Math.sin(a)*rad;
    if(i===0)ctx.moveTo(px,py); else ctx.lineTo(px,py); }
  ctx.closePath(); ctx.fill();
}
function drawAccessory(ctx,def,x,cy,r){
  const top=cy-r*0.28;
  ctx.fillStyle=def.trim; ctx.strokeStyle=def.trim;
  switch(def.accessory){
    case "horns":
      for(const s of [-1,1]){ ctx.beginPath(); ctx.moveTo(x+s*r*0.52,top-r*0.42); ctx.lineTo(x+s*r*0.86,top-r*0.78); ctx.lineTo(x+s*r*0.72,top-r*0.3); ctx.closePath(); ctx.fill(); }
      break;
    case "halo":
      ctx.beginPath(); ctx.ellipse(x,top-r*0.92,r*0.42,r*0.13,0,0,Math.PI*2);
      ctx.lineWidth=Math.max(2,r*0.09); ctx.strokeStyle="#fde047"; ctx.stroke(); break;
    case "fin":
      ctx.beginPath(); ctx.moveTo(x-r*0.08,top-r*0.5); ctx.lineTo(x+r*0.04,top-r*1.02); ctx.lineTo(x+r*0.2,top-r*0.48); ctx.closePath(); ctx.fill(); break;
    case "ears":
      for(const s of [-1,1]){ ctx.beginPath(); ctx.arc(x+s*r*0.68,top-r*0.34,r*0.2,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x+s*r*0.68,top-r*0.34,r*0.1,0,Math.PI*2); ctx.fillStyle=def.suit; ctx.fill(); ctx.fillStyle=def.trim; }
      break;
    case "crown":
      ctx.beginPath(); ctx.moveTo(x-r*0.3,top-r*0.62); ctx.lineTo(x-r*0.3,top-r*0.88); ctx.lineTo(x-r*0.14,top-r*0.7); ctx.lineTo(x,top-r*0.94); ctx.lineTo(x+r*0.14,top-r*0.7); ctx.lineTo(x+r*0.3,top-r*0.88); ctx.lineTo(x+r*0.3,top-r*0.62); ctx.closePath();
      ctx.fillStyle="#facc15"; ctx.fill(); break;
    case "star-antenna":
      ctx.lineWidth=Math.max(2,r*0.06); ctx.beginPath(); ctx.moveTo(x,top-r*0.7); ctx.lineTo(x,top-r*0.98); ctx.stroke();
      drawTinyStar(ctx,x,top-r*1.06,r*0.16); break;
    case "goggles":
      ctx.fillStyle="rgba(14,20,44,0.9)"; roundRect(ctx,x-r*0.52,top-r*0.28,r*1.04,r*0.24,r*0.1); ctx.fill();
      ctx.fillStyle=def.trim; ctx.beginPath();
      ctx.arc(x-r*0.26,top-r*0.16,r*0.09,0,Math.PI*2); ctx.arc(x+r*0.26,top-r*0.16,r*0.09,0,Math.PI*2); ctx.fill(); break;
    default: break;
  }
}
function drawNebulux(ctx,x,y,r){
  ctx.save();
  const flicker=0.85+Math.random()*0.3;
  ctx.beginPath(); ctx.moveTo(x-r*0.3,y+r*0.75); ctx.lineTo(x,y+r*0.75+r*0.55*flicker); ctx.lineTo(x+r*0.3,y+r*0.75); ctx.closePath();
  ctx.fillStyle="#fb923c"; ctx.fill();
  ctx.beginPath(); ctx.moveTo(x-r*0.16,y+r*0.75); ctx.lineTo(x,y+r*0.75+r*0.32*flicker); ctx.lineTo(x+r*0.16,y+r*0.75); ctx.closePath();

  ctx.lineWidth=Math.max(2,r*0.07); ctx.strokeStyle="rgba(16,10,40,0.5)"; ctx.stroke();
  ctx.beginPath(); ctx.arc(x,y-r*0.05,r*0.52,0,Math.PI*2); ctx.fillStyle="#101736"; ctx.fill();
  ctx.beginPath(); ctx.arc(x,y-r*0.05,r*0.34,0,Math.PI*2); ctx.fillStyle="#38bdf8"; ctx.fill();
  ctx.beginPath(); ctx.arc(x,y-r*0.05,r*0.17,0,Math.PI*2); ctx.fillStyle="#0c2440"; ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*0.12,y-r*0.2,r*0.09,0,Math.PI*2); ctx.fillStyle="#ffffff"; ctx.fill();
  ctx.strokeStyle="#64748b"; ctx.lineWidth=Math.max(2,r*0.08);
  ctx.beginPath(); ctx.moveTo(x,y-r*0.95); ctx.lineTo(x,y-r*1.25); ctx.stroke();
  ctx.beginPath(); ctx.arc(x,y-r*1.3,r*0.13,0,Math.PI*2); ctx.fillStyle="#fb4d6d"; ctx.fill();
  ctx.fillStyle="#7dd3fc"; ctx.beginPath();
  ctx.arc(x-r*0.98,y+r*0.1,r*0.2,0,Math.PI*2); ctx.arc(x+r*0.98,y+r*0.1,r*0.2,0,Math.PI*2); ctx.fill();

}
function drawBrawlerFigure(ctx,def,x,y,r,opts){

  const cy=y+bob;

  ctx.beginPath(); ctx.ellipse(x,y+r*0.92,r*0.95,r*0.34,0,0,Math.PI*2);

  if(opts.teamRing){

  }

  ctx.fillStyle=def.suit; ctx.fill();
  ctx.lineWidth=Math.max(2,r*0.07); ctx.strokeStyle="rgba(16,10,40,0.55)"; ctx.stroke();
  // Suit pattern
  ctx.save();
  ctx.beginPath(); ctx.arc(x,cy+r*0.34,r*0.7,0,Math.PI*2); ctx.clip();
  ctx.fillStyle=def.trim; ctx.globalAlpha=(opts.ghost?0.35:1)*0.5;

    ctx.fillRect(x-r*0.72,cy+r*0.02,r*1.44,r*0.12); ctx.fillRect(x-r*0.72,cy+r*0.52,r*1.44,r*0.12);
  }else if(def.pattern==="chevron"){
    ctx.beginPath(); ctx.moveTo(x-r*0.5,cy+r*0.1); ctx.lineTo(x,cy+r*0.38); ctx.lineTo(x+r*0.5,cy+r*0.1); ctx.lineTo(x+r*0.5,cy+r*0.26); ctx.lineTo(x,cy+r*0.54); ctx.lineTo(x-r*0.5,cy+r*0.26); ctx.closePath(); ctx.fill();
  }else if(def.pattern==="dots"){
    for(const d of [[-0.42,0.05],[0.42,0.05],[-0.2,0.62],[0.24,0.6]]){ ctx.beginPath(); ctx.arc(x+d[0]*r,cy+d[1]*r+r*0.34,r*0.09,0,Math.PI*2); ctx.fill(); }
  }else if(def.pattern==="stars"){
    drawTinyStar(ctx,x-r*0.4,cy+r*0.42,r*0.13); drawTinyStar(ctx,x+r*0.44,cy+r*0.62,r*0.1);
  }else if(def.pattern==="grid"){
    ctx.fillRect(x-r*0.06,cy-r*0.36,r*0.1,r*1.4); ctx.fillRect(x-r*0.72,cy+r*0.3,r*1.44,r*0.1);
  }
  ctx.restore();
  ctx.globalAlpha=opts.ghost?0.35:1;
  // Chest emblem
  ctx.beginPath(); ctx.arc(x,cy+r*0.34,r*0.24,0,Math.PI*2); ctx.fillStyle=def.trim; ctx.fill();
  const emblem=hashCode(def.id)%3;
  ctx.fillStyle="rgba(16,10,40,0.65)";
  if(emblem===0){ drawTinyStar(ctx,x,cy+r*0.34,r*0.13); }
  else if(emblem===1){ ctx.beginPath(); ctx.arc(x,cy+r*0.34,r*0.1,0,Math.PI*2); ctx.fill(); }
  else{ ctx.beginPath(); ctx.moveTo(x,cy+r*0.2); ctx.lineTo(x+r*0.12,cy+r*0.44); ctx.lineTo(x-r*0.12,cy+r*0.44); ctx.closePath(); ctx.fill(); }

  ctx.fillStyle=def.trim; roundRect(ctx,r*1.02,-r*0.09,r*0.22,r*0.18,r*0.06); ctx.fill();
  ctx.restore();
  // Helmet dome + face
  ctx.beginPath(); ctx.arc(x,cy-r*0.28,r*0.78,0,Math.PI*2);
  const grad=ctx.createRadialGradient(x-r*0.25,cy-r*0.55,r*0.15,x,cy-r*0.28,r*0.85);
  grad.addColorStop(0,"rgba(210,240,255,0.95)"); grad.addColorStop(0.55,"rgba(140,190,240,0.5)"); grad.addColorStop(1,"rgba(80,120,220,0.35)");

  }else if(def.hairStyle==="cap"){
    ctx.beginPath(); ctx.arc(x,hy-r*0.08,r*0.58,Math.PI,Math.PI*2); ctx.fill();

    ctx.beginPath(); ctx.arc(x+r*0.4,hy-r*0.88,r*0.11,0,Math.PI*2); ctx.fillStyle=def.trim; ctx.fill();
    ctx.beginPath(); ctx.arc(x,hy,r*0.57,Math.PI*1.05,Math.PI*1.95); ctx.fillStyle=def.hair; ctx.fill();
  }else if(def.hairStyle==="hood"){
    ctx.beginPath(); ctx.arc(x,hy,r*0.6,Math.PI*0.9,Math.PI*2.1); ctx.lineWidth=r*0.18; ctx.strokeStyle=def.hair; ctx.stroke();
  }else{
    for(let i=-2;i<=2;i++){ const sx=x+i*r*0.2; ctx.beginPath(); ctx.moveTo(sx-r*0.09,hy-r*0.42); ctx.lineTo(sx,hy-r*0.78); ctx.lineTo(sx+r*0.09,hy-r*0.42); ctx.closePath(); ctx.fill(); }
  }

  ctx.fillStyle="#221a3d";
  const lookX=fx*r*0.07, lookY=fy*r*0.05;
  ctx.beginPath();
  ctx.arc(x-r*0.2+lookX,hy+r*0.02+lookY,r*0.07,0,Math.PI*2);
  ctx.arc(x+r*0.2+lookX,hy+r*0.02+lookY,r*0.07,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="#221a3d"; ctx.lineWidth=Math.max(1.5,r*0.045);

    drawNebulux(ctx,x+r*1.55,y-r*0.75+Math.sin(time*2.6)*r*0.08,r*0.52);
  }
}

const SFX=(()=>{
  let ac=null, muted=/[?&](mute|test)\b/.test(location.search);
  try{ if(localStorage.getItem("nebula-brawl-mute")==="1")muted=true; }catch(e){}
  const tone=(f0,f1,dur,type,vol,delay)=>{
    const t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
  };
  const noise=(dur,vol,delay)=>{
    const t=ac.currentTime+(delay||0), n=Math.floor(ac.sampleRate*dur), buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const src=ac.createBufferSource(), g=ac.createGain(); src.buffer=buf; g.gain.value=vol; src.connect(g); g.connect(ac.destination); src.start(t);
  };
  const S={
    shoot:(v)=>tone(620,240,0.07,"square",0.045*v),
    lob:(v)=>tone(240,520,0.16,"triangle",0.06*v),
    boom:(v)=>{ noise(0.28,0.16*v); tone(140,40,0.3,"sine",0.14*v); },
    hit:(v)=>tone(300,120,0.06,"sawtooth",0.05*v),
    hurt:(v)=>{ tone(180,70,0.14,"sawtooth",0.09*v); noise(0.08,0.06*v); },
    ko:(v)=>{ tone(520,90,0.32,"square",0.08*v); noise(0.2,0.1*v); },
    super:(v)=>{ tone(300,900,0.22,"sawtooth",0.07*v); tone(600,1400,0.22,"triangle",0.05*v,0.08); },
    ready:()=>{ tone(660,660,0.09,"triangle",0.07); tone(990,990,0.14,"triangle",0.07,0.09); },
    gem:(v)=>{ tone(880,1320,0.09,"triangle",0.06*v); },
    power:()=>{ tone(440,880,0.12,"square",0.05); tone(660,1320,0.16,"square",0.05,0.1); },
    goal:()=>{ [523,659,784,1047].forEach((f,i)=>tone(f,f,0.16,"triangle",0.09,i*0.09)); },
    win:()=>{ [523,659,784,1047,1319].forEach((f,i)=>tone(f,f,0.22,"triangle",0.1,i*0.12)); },
    lose:()=>{ [392,330,262,196].forEach((f,i)=>tone(f,f,0.26,"sawtooth",0.07,i*0.16)); },
    tick:()=>tone(880,880,0.05,"square",0.04),
    ui:()=>tone(700,900,0.05,"triangle",0.05)
  };
  return {
    play(name,v){ if(muted||!S[name])return; try{ if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended")ac.resume(); S[name](v==null?1:Math.max(0.15,Math.min(1,v))); }catch(e){} },
    get muted(){ return muted; },
    // one sixteenth-note step of the music; called by the music clock below
    beat(kind,n,fast){
      if(muted||!ac||ac.state!=="running")return;
      const CH=[[262,330,392],[220,262,330],[175,220,262],[196,247,294]], c=CH[Math.floor(n/16)%4], k=n%16, t=ac.currentTime;
      const blip=(f,d,type,v,when)=>{ const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(v,t+(when||0)); g.gain.exponentialRampToValueAtTime(0.0001,t+(when||0)+d); o.connect(g); g.connect(ac.destination); o.start(t+(when||0)); o.stop(t+(when||0)+d+0.02); };
      if(kind==="lobby"){
        if(k%4===0)blip(c[0]/2,0.5,"sine",0.035);
        if(k%2===0)blip(c[[0,1,2,1,2,1,0,2][(k/2)%8]]*2,0.18,"triangle",0.018);
      }else{
        if(k%4===0)blip(c[0]/2,0.22,"sine",0.05);
        if(k%8===4)blip(c[0]/4,0.12,"square",0.02);
        if(k%2===1)blip(c[[0,2,1,2,0,1,2,1][(k>>1)%8]]*2,0.09,"triangle",fast?0.022:0.015);
        if(fast&&k%4===2)blip(c[2]*4,0.05,"square",0.01);
        if(k%4===2){ const nb=Math.floor(ac.sampleRate*0.03), bf=ac.createBuffer(1,nb,ac.sampleRate), dd=bf.getChannelData(0); for(let i=0;i<nb;i++)dd[i]=(Math.random()*2-1)*(1-i/nb); const sr=ac.createBufferSource(), g=ac.createGain(); sr.buffer=bf; g.gain.value=fast?0.03:0.018; sr.connect(g); g.connect(ac.destination); sr.start(t); }
      }
    },
    wake(){ if(muted)return; try{ if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended")ac.resume(); }catch(e){} },
    toggle(){ muted=!muted; try{ localStorage.setItem("nebula-brawl-mute",muted?"1":"0"); }catch(e){} return muted; }
  };
})();

{ let n=0, nextAt=0;

    if(!document.hidden&&kind&&now>=nextAt){ nextAt=now+step; SFX.beat(kind,n++,window.__musicFast); } };

function makeFighter(id,def,team,name,isPlayer,spawn,level,perk){
  const mul=1+0.06*(Math.max(1,level||1)-1), hp0=Math.round(def.hp*mul/10)*10;
  return { id,def,team,isPlayer,name, pos:{...spawn}, vel:{x:0,y:0},
    level:Math.max(1,level||1), baseMul:mul, dmgMul:mul, cores:0, shieldT:0, guardT:0, gad:(Math.max(1,level||1)>=GADGET_LEVEL?gadgetOf(def):null), gadN:GADGET_USES, gadCd:0, jetT:0, barrier:0, barrierT:0, bounty:2, showBounty:false, dealt:0, kills:0, lobDist:null,
    hp:hp0, maxHp:hp0, radius:def.radius,
    facing:team===0?-Math.PI/2:Math.PI/2, aimDir:null,
    ammo:def.maxAmmo, reloadT:0, fireCd:0, superCharge:0, superReady:false, hyper:0, hyperT:0, hyperOk:Math.max(1,level||1)>=HYPER_LEVEL,
    perk:(Math.max(1,level||1)>=PERK_LEVEL?(perk||perkPair(def)[hashCode(def.id+name)%2]):null),
    gems:0, alive:true, respawnT:0, lastDamageT:-99, regenDelay:4, hitFlash:0,
    walkPhase:Math.random()*6,
    ai:{ targetPos:{...spawn}, repath:0, strafeDir:1, strafeT:0, holdFire:0 } };
}

class Match{
  constructor(setup){
    this.setup=setup; this.mode=setup.mode;
    this.fighters=[]; this.bullets=[]; this.turrets=[]; this.gems=[];
    this.particles=[]; this.floaters=[];
    if(setup.map!=null)useMap(setup.map);
    this.cratesHp=CRATES.map(c=>c.hp); this.crateAlive=CRATES.map(()=>true);
    this.time=0; this.timeLeft=this.matchDuration(); this.mineT=1.2; this.gemSeq=0;
    this.countdownTeam="fighting"; this.countdownT=COUNTDOWN_TIME;
    this.finished=false; this.result=null; this.playerKills=0;
    this.ball={pos:{x:WORLD_W/2,y:WORLD_H/2},vel:{x:0,y:0}};
    this.ballFreezeT=0; this.ballCarrier=null; this.ballPickupDelayT=0;
    this.blueScore=0; this.redScore=0;
    this.kos=[0,0];
    this.zoneR=Math.hypot(WORLD_W,WORLD_H)/2;
    this.goalFlashT=0; this.goalFlashTeam=0;
    this.slowZones=[];
    this.skill=setup.skill==null?0.6:setup.skill;
    this.feed=[]; this.shake=0; this.cores=[]; this.coreSeq=0; this.stars=[0,0]; this.zonePts=[0,0]; this.tickT=0;
    this.vaults=this.mode==="vault"?[{team:0,pos:{x:WORLD_W/2,y:WORLD_H-250},hp:VAULT_HP,maxHp:VAULT_HP,hitFlash:0},{team:1,pos:{x:WORLD_W/2,y:250},hp:VAULT_HP,maxHp:VAULT_HP,hitFlash:0}]:[];
    this.zones=this.mode==="zone"?[{pos:{x:190,y:WORLD_H/2},r:115,owner:-1},{pos:{x:WORLD_W-190,y:WORLD_H/2},r:115,owner:-1}]:[];
    if(this.mode==="vault")CRATES.forEach((c,i)=>{ if(Math.abs(c.x-WORLD_W/2)<130&&(c.y<340||c.y>WORLD_H-340))this.crateAlive[i]=false; });
    const lv=setup.level||1, foeLv=setup.foeLevel||lv;
    const spawns=this.mode==="showdown"?SHOWDOWN_SPAWNS:SPAWNS;
    const blue=[
      makeFighter(0,setup.playerDef,0,"You",true,spawns[0][0],lv,setup.perk),
      makeFighter(1,setup.blueMateDefs[0],0,setup.blueMateNames[0],false,spawns[0][1],lv),
      makeFighter(2,setup.blueMateDefs[1],0,setup.blueMateNames[1],false,spawns[0][2],lv)
    ];
    const red=setup.redDefs.map((def,i)=>makeFighter(3+i,def,1,setup.redNames[i],false,spawns[1][i],foeLv));
    this.fighters=[...blue,...red];
    if(this.mode==="hunt")for(const f of this.fighters)f.showBounty=true;
    if(this.mode==="train"){
      for(const f of this.fighters){ if(f.team===0&&f.id!==0){ f.out=true; f.alive=false; f.respawnT=1e9; } if(f.team===1){ f.dummy=true; f.gad=null; f.hyperOk=false; } }
    }
    if(this.mode==="duel"){
      for(const f of this.fighters)if(f.id!==0&&f.id!==3){ f.out=true; f.alive=false; f.respawnT=1e9; }
      this.fighters[3].pos={x:WORLD_W/2,y:220}; this.fighters[0].pos={x:WORLD_W/2,y:WORLD_H-220};
    }
    if(this.mode==="titan"){
      const mul=1+0.15*((setup.level||1)-1), red=this.fighters.filter(f=>f.team===1);
      const T=red[0]; T.def=TITAN_DEF; T.name="The Titan"; T.radius=TITAN_DEF.radius; T.maxHp=T.hp=Math.round(TITAN_HP*mul); T.titan=true; T.pos={x:WORLD_W/2,y:300}; T.gad=null; T.hyperOk=false; T.perk=null; T.ammo=3;
      for(const d of red.slice(1)){ d.def=DRONE_DEF; d.name="Drone"; d.radius=DRONE_DEF.radius; d.maxHp=d.hp=Math.round(DRONE_DEF.hp*mul); d.gad=null; d.hyperOk=false; d.perk=null; d.ammo=3; }
      this.titan=T; this.titanRage=false;
    }
    for(const f of this.fighters)if(f.perk==="saver")f.superCharge=1/3;
  }
  // who the camera follows: you, or once you're out of Storm Standoff a crewmate still in
  watchTarget(){ const p=this.player; if(this.mode!=="showdown"||p.alive||this.finished)return p; return this.fighters.find(f=>f.team===p.team&&f.alive&&!f.out&&f!==p)||p; }
  matchDuration(){ if(this.mode==="train")return 120; if(this.mode==="ball")return BALL_TIME; if(this.mode==="showdown")return SHOWDOWN_TIME; if(this.mode==="arena")return ARENA_TIME; if(this.mode==="vault")return VAULT_TIME; if(this.mode==="titan")return TITAN_TIME; if(this.mode==="duel")return DUEL_TIME; if(this.mode==="zone")return ZONE_TIME; if(this.mode==="hunt")return HUNT_TIME; return MATCH_TIME; }
  scores(){
    const m=this.mode;
    if(m==="ball")return [this.blueScore,this.redScore];
    if(m==="arena")return [this.kos[0],this.kos[1]];
    if(m==="showdown")return [this.aliveCount(0),this.aliveCount(1)];
    if(m==="vault")return this.vaults.map(v=>Math.max(0,Math.ceil(100*v.hp/v.maxHp)));
    if(m==="zone")return this.zonePts.map(p=>Math.min(100,Math.floor(p)));
    if(m==="hunt")return [this.stars[0],this.stars[1]];
    if(m==="duel"||m==="train")return [this.kos[0],this.kos[1]];
    if(m==="titan"){ const t=this.titan; return [t?Math.round(100*(1-Math.max(0,t.hp)/t.maxHp)):0,t?Math.max(0,Math.ceil(100*t.hp/t.maxHp)):0]; }
    return [this.teamGems(0),this.teamGems(1)];
  }
  sfx(name,pos){
    if(this.quiet)return;
    const d=pos?dist(pos,this.player.pos):0;
    if(d>760)return;
    SFX.play(name,1-d/950);
  }
  aliveCount(team){ return this.fighters.filter(f=>f.team===team&&f.alive&&!f.out).length; }
  get player(){ return this.fighters[0]; }
  teamGems(team){ let t=0; for(const f of this.fighters) if(f.team===team)t+=f.gems; return t; }
  boxes(){
    const b=solidBoxes(this.crateAlive);
    for(const v of this.vaults)if(v.hp>0)b.push({x:v.pos.x-44,y:v.pos.y-44,w:88,h:88,kind:"vault",crateIndex:-1,vault:v});
    return b;
  }

  update(dt,input){
    if(this.finished)return;
    this.time+=dt;
    this.timeLeft=Math.max(0,this.matchDuration()-this.time);
    const boxes=this.boxes();
    // Gem mine spawner (Crystal Rush + Ranked only)
    this.mineT-=dt;
    if(this.mineT<=0&&(this.mode==="gem"||this.mode==="ranked")){
      this.mineT=MINE_INTERVAL;
      const angle=Math.random()*Math.PI*2, r=26+Math.random()*42;
      this.gems.push({id:this.gemSeq++,pos:{x:clamp(MINE_POS.x+Math.cos(angle)*r,30,WORLD_W-30),y:clamp(MINE_POS.y+Math.sin(angle)*r,30,WORLD_H-30)},taken:false});
    }
    // Player control
    const p=this.player;
    if(p.alive){
      const mag=Math.hypot(input.move.x,input.move.y);
      if(mag>0.12){
        const sp=this.speedOf(p);
        p.vel={x:(input.move.x/Math.max(1,mag))*sp*Math.min(1,mag),y:(input.move.y/Math.max(1,mag))*sp*Math.min(1,mag)};
        p.facing=Math.atan2(input.move.y,input.move.x);
      }else{ p.vel={x:0,y:0}; }
      if(input.aim)p.facing=Math.atan2(input.aim.y,input.aim.x);
      p.aimDir=input.aim; p.lobDist=input.aimDist||null;
      if(input.firing&&input.aim)this.tryFire(p,input.aim);
      if(input.useSuper)this.useSuper(p);
      if(input.useGadget)this.useGadget(p);
      if(input.useHyper)this.useHyper(p);
    }
    if(this.net&&this.net.role==="host"){
      for(const g of this.net.guests){
        const f=this.fighters[g.slot], sg=g.slot>=3?-1:1, ri=this.netIn&&this.netIn(g.peer);
        if(!f||!f.remote||!f.alive||!ri)continue;
        const mv=ri.mv||[0,0], mag=Math.hypot(mv[0],mv[1]);
        if(mag>0.12){ const sp=this.speedOf(f); f.vel={x:sg*mv[0]/Math.max(1,mag)*sp*Math.min(1,mag),y:sg*mv[1]/Math.max(1,mag)*sp*Math.min(1,mag)}; f.facing=Math.atan2(sg*mv[1],sg*mv[0]); } else f.vel={x:0,y:0};
        if(ri.am){ f.aimDir={x:sg*ri.am[0],y:sg*ri.am[1]}; f.facing=Math.atan2(sg*ri.am[1],sg*ri.am[0]); }
        const D=f.rDone||(f.rDone={fs:ri.fs|0,ss:ri.ss|0,gs:ri.gs|0,hs:ri.hs|0});
        if((ri.fs|0)>D.fs){ D.fs=ri.fs|0; if(ri.fa){ f.lobDist=ri.fd||null; this.tryFire(f,{x:sg*ri.fa[0],y:sg*ri.fa[1]}); } }
        if((ri.ss|0)>D.ss){ D.ss=ri.ss|0; this.useSuper(f); }
        if((ri.gs|0)>D.gs){ D.gs=ri.gs|0; this.useGadget(f); }
        if((ri.hs|0)>D.hs){ D.hs=ri.hs|0; this.useHyper(f); }
        if((ri.ps|0)>(D.ps|0)){ D.ps=ri.ps|0; if(PINS.includes(ri.pt))this.pin(f,ri.pt); }
      }
    }
    for(const f of this.fighters){
      if(f.remote){ this.stepFighter(f,dt,boxes); continue; }
      if(!f.isPlayer)this.botThink(f,dt,boxes);
      this.stepFighter(f,dt,boxes);
    }
    // Turrets (Nebulux & sentries)
    for(const t of this.turrets){
      t.hitFlash=Math.max(0,t.hitFlash-dt*6);
      t.cooldown-=dt;
      if(t.cooldown<=0){
        let best=null,bestD=320;
        for(const f of this.fighters){
          if(!f.alive||f.team===t.team)continue;
          if(this.hiddenFrom(f,t.team))continue;
          const d=dist(t.pos,f.pos);
          if(d<bestD&&lineOfSight(t.pos,f.pos,boxes)){ best=f; bestD=d; }
        }
        if(best){
          t.cooldown=0.55;
          t.facing=Math.atan2(best.pos.y-t.pos.y,best.pos.x-t.pos.x);
          this.bullets.push({pos:{x:t.pos.x,y:t.pos.y-6},vel:{x:Math.cos(t.facing)*560,y:Math.sin(t.facing)*560},team:t.team,ownerId:t.ownerId,damage:420,life:0.65,radius:6,color:"#fde047",big:false});
        }else{ t.cooldown=0.15; }
      }
    }
    this.turrets=this.turrets.filter(t=>t.hp>0);
    // Bullets
    this.shake=Math.max(0,this.shake-dt*42);
    for(const v of this.vaults){
      v.hitFlash=Math.max(0,v.hitFlash-dt*5);
      if(v.hp<=0)continue;
      v.cd=(v.cd==null?1.5:v.cd)-dt;
      if(v.cd<=0){
        let best=null,bestD=255;
        for(const f of this.fighters){ if(!f.alive||f.team===v.team)continue; const d=dist(v.pos,f.pos); if(d<bestD){ best=f; bestD=d; } }
        if(best){
          v.cd=1.1;
          const a=Math.atan2(best.pos.y-v.pos.y,best.pos.x-v.pos.x);
          this.bullets.push({pos:{x:v.pos.x+Math.cos(a)*66,y:v.pos.y+Math.sin(a)*66},vel:{x:Math.cos(a)*540,y:Math.sin(a)*540},team:v.team,ownerId:-1,damage:560,life:0.5,radius:8,color:v.team===0?"#67e8f9":"#fda4af",big:false});
          this.sfx("shoot",v.pos);
        }else v.cd=0.2;
      }
    }
    const deadBullets=new Set();
    for(const b of this.bullets){
      if(b.lob){
        b.lob.t+=dt;
        const k=Math.min(1,b.lob.t/b.lob.dur);
        b.pos={x:b.lob.from.x+(b.lob.to.x-b.lob.from.x)*k,y:b.lob.from.y+(b.lob.to.y-b.lob.from.y)*k};
        b.h=Math.sin(k*Math.PI)*(60+b.lob.dur*70);
        if(k>=1){ deadBullets.add(b); this.explode(b.pos,b.aoe,b.damage,b.team,b.ownerId,!!b.meteor,b.color); }
        continue;
      }
      b.life-=dt;
      const from={...b.pos};
      b.pos={x:b.pos.x+b.vel.x*dt,y:b.pos.y+b.vel.y*dt};
      if(b.life<=0||b.pos.x<4||b.pos.x>WORLD_W-4||b.pos.y<4||b.pos.y>WORLD_H-4){ deadBullets.add(b); continue; }
      let hitBox=null;
      for(let i=1;i<=3;i++){
        const x=from.x+(b.pos.x-from.x)*(i/3), y=from.y+(b.pos.y-from.y)*(i/3);
        for(const box of boxes){ if(x>=box.x&&x<=box.x+box.w&&y>=box.y&&y<=box.y+box.h){ hitBox=box; break; } }
        if(hitBox)break;
      }
      if(hitBox){
        deadBullets.add(b);
        if(hitBox.kind==="crate"&&hitBox.crateIndex>=0)this.damageCrate(hitBox.crateIndex,b.damage,b.ownerId);
        if(hitBox.kind==="vault"&&hitBox.vault.team!==b.team)this.damageVault(hitBox.vault,b.damage,b.ownerId);
        this.burst(b.pos,3,"#cbd5e1",90);
        continue;
      }
      for(const f of this.fighters){
        if(!f.alive||f.team===b.team)continue;
        if(dist(b.pos,f.pos)<f.radius+b.radius){
          if(b.pierce){ if(b.hitIds.indexOf(f.id)>=0)continue; b.hitIds.push(f.id); this.damageFighter(f,Math.round(b.damage*(b.hitIds.length>1?0.7:1)),b.ownerId,b.big); continue; }
          deadBullets.add(b); this.damageFighter(f,b.damage,b.ownerId,b.big); break;
        }
      }
      if(!deadBullets.has(b)){
        for(const t of this.turrets){
          if(t.team===b.team)continue;
          if(dist(b.pos,t.pos)<24+b.radius){ deadBullets.add(b); t.hp-=b.damage; t.hitFlash=1; if(t.hp<=0)this.burst(t.pos,14,"#fde047",180); break; }
        }
      }
    }
    this.bullets=this.bullets.filter(b=>!deadBullets.has(b));
    // Ball gets kicked by shots flying through it (loose ball only)
    // Gem pickup
    for(const g of this.gems){
      if(g.taken)continue;
      for(const f of this.fighters){
        if(!f.alive)continue;
        if(dist(g.pos,f.pos)<f.radius+16){ g.taken=true; f.gems+=1; this.burst(g.pos,5,"#ffd23f",70); this.sfx("gem",g.pos); break; }
      }
    }
    this.gems=this.gems.filter(g=>!g.taken);
    // Power cores (Storm Standoff): more health and harder hits for the rest of the match
    for(const c of this.cores){
      if(c.taken)continue;
      for(const f of this.fighters){
        if(!f.alive)continue;
        if(dist(c.pos,f.pos)<f.radius+18){
          c.taken=true; f.cores+=1; f.maxHp+=CORE_HP; f.hp+=CORE_HP; f.dmgMul=f.baseMul*(1+0.08*Math.min(10,f.cores));
          this.burst(c.pos,10,"#4ade80",120); this.float({x:f.pos.x,y:f.pos.y-f.radius-20},"POWER UP!","#4ade80");
          if(f.isPlayer)SFX.play("power"); break;
        }
      }
    }
    this.cores=this.cores.filter(c=>!c.taken);
    if(this.mode==="zone")this.updateZones(dt);
    this.stepMines(dt);
    if(this.wells&&this.wells.length){
      const boxes2=this.boxes();
      for(const w of this.wells){
        w.t-=dt;
        for(const e of this.fighters){ if(!e.alive||e.team===w.team||e.titan)continue; const d=dist(e.pos,w.pos); if(d<200&&d>6){ const k=Math.min(1,(200-d)/200+0.6)*360*dt; e.pos=collideCircle({x:e.pos.x+(w.pos.x-e.pos.x)/d*k,y:e.pos.y+(w.pos.y-e.pos.y)/d*k},e.radius,boxes2); } }
        if(Math.random()<0.6)this.particles.push({pos:{x:w.pos.x+(Math.random()-0.5)*260,y:w.pos.y+(Math.random()-0.5)*260},vel:{x:0,y:0},life:0.3,maxLife:0.3,size:3,color:"#f0abfc",to:w.pos});
        if(w.t<=0)this.explode(w.pos,95,w.dmg,w.team,w.ownerId,true,"#c026d3");
      }
      this.wells=this.wells.filter(w=>w.t>0);
    }
    this.feed=this.feed.filter(k=>this.time-k.t<4.5);
    // Particles & floaters
    for(const pt of this.particles){ pt.life-=dt; if(pt.to){ pt.pos.x+=(pt.to.x-pt.pos.x)*Math.min(1,dt*7); pt.pos.y+=(pt.to.y-pt.pos.y)*Math.min(1,dt*7); continue; } pt.pos.x+=pt.vel.x*dt; pt.pos.y+=pt.vel.y*dt; pt.vel.x*=0.92; pt.vel.y*=0.92; }
    this.particles=this.particles.filter(pt=>pt.life>0);
    if(this.pins&&this.pins.length){ for(const p of this.pins)p.t-=dt; this.pins=this.pins.filter(p=>p.t>0&&p.f.alive); }
    if(this.pinLater){ this.pinLater.t-=dt; if(this.pinLater.t<=0){ const q=this.pinLater; this.pinLater=null; this.pins=(this.pins||[]).filter(p=>p.f!==q.f); if(q.f.alive)this.pins.push({f:q.f,text:q.text,t:1.6}); } }
    for(const fl of this.floaters){ fl.life-=dt; fl.pos.x+=VIEW_UP.x*34*dt; fl.pos.y+=VIEW_UP.y*34*dt; }
    this.floaters=this.floaters.filter(fl=>fl.life>0);
    if(this.mode==="ball")this.updateBall(dt,boxes);
    if(this.mode==="showdown")this.updateShowdown(dt);
    this.updateWinState(dt);
  }

  resetBallPositions(){
    this.ball.pos={x:WORLD_W/2,y:WORLD_H/2}; this.ball.vel={x:0,y:0};
    this.ballCarrier=null; this.ballPickupDelayT=0; this.ballFreezeT=1.6;
    this.fighters.forEach((f,i)=>{
      const spawn=SPAWNS[f.team][i%3];
      f.pos={...spawn}; f.vel={x:0,y:0};
      if(!f.alive){ f.alive=true; f.hp=f.maxHp; }
    });
  }
  updateBall(dt,boxes){
    if(this.goalFlashT>0)this.goalFlashT-=dt;
    if(this.ballFreezeT>0){ this.ballFreezeT-=dt; return; }
    const b=this.ball;
    this.ballPickupDelayT=Math.max(0,this.ballPickupDelayT-dt);
    const carrier=this.ballCarrier!==null?this.fighters.find(f=>f.id===this.ballCarrier&&f.alive):undefined;
    if(this.ballCarrier!==null&&!carrier)this.ballCarrier=null;
    if(carrier){
      b.pos={x:carrier.pos.x+Math.cos(carrier.facing)*(carrier.radius+14),y:carrier.pos.y+Math.sin(carrier.facing)*(carrier.radius+14)};
      b.vel={x:0,y:0};
      const inMouthX=Math.abs(b.pos.x-WORLD_W/2)<GOAL_HALF;
      if(inMouthX&&b.pos.y<GOAL_DEPTH+16)this.onGoal(0);
      else if(inMouthX&&b.pos.y>WORLD_H-GOAL_DEPTH-16)this.onGoal(1);
      return;
    }
    b.pos.x+=b.vel.x*dt; b.pos.y+=b.vel.y*dt;
    b.vel.x*=Math.pow(0.25,dt); b.vel.y*=Math.pow(0.25,dt);
    if(Math.hypot(b.vel.x,b.vel.y)<4)b.vel={x:0,y:0};
    if(this.ballPickupDelayT<=0&&Math.hypot(b.vel.x,b.vel.y)<330){
      for(const f of this.fighters){
        if(!f.alive)continue;
        if(dist(b.pos,f.pos)<f.radius+16){ this.ballCarrier=f.id; b.vel={x:0,y:0}; this.burst(b.pos,6,"#fde047",90); break; }
      }
    }
    for(const bl of this.bullets){
      if(bl.lob)continue;
      if(dist(bl.pos,b.pos)<bl.radius+15){
        const sp=Math.max(420,Math.hypot(bl.vel.x,bl.vel.y));
        const a=Math.atan2(bl.vel.y,bl.vel.x);
        b.vel={x:Math.cos(a)*sp*0.95,y:Math.sin(a)*sp*0.95};
        bl.life=0; this.burst(b.pos,6,"#fde047",120);
      }
    }
    const inMouthX=Math.abs(b.pos.x-WORLD_W/2)<GOAL_HALF;
    if(b.pos.x<16){b.pos.x=16;b.vel.x=Math.abs(b.vel.x);}
    if(b.pos.x>WORLD_W-16){b.pos.x=WORLD_W-16;b.vel.x=-Math.abs(b.vel.x);}
    if(b.pos.y<16&&!inMouthX){b.pos.y=16;b.vel.y=Math.abs(b.vel.y);}
    if(b.pos.y>WORLD_H-16&&!inMouthX){b.pos.y=WORLD_H-16;b.vel.y=-Math.abs(b.vel.y);}
    for(const box of boxes){
      const nx=clamp(b.pos.x,box.x,box.x+box.w), ny=clamp(b.pos.y,box.y,box.y+box.h);
      const d=Math.hypot(b.pos.x-nx,b.pos.y-ny);
      if(d<15&&d>0.01){
        const ux=(b.pos.x-nx)/d, uy=(b.pos.y-ny)/d;
        b.pos.x=nx+ux*15; b.pos.y=ny+uy*15;
        const dot=b.vel.x*ux+b.vel.y*uy;
        if(dot<0){ b.vel.x-=2*dot*ux; b.vel.y-=2*dot*uy; }
      }
    }
    if(b.pos.y<10&&inMouthX)this.onGoal(0);
    else if(b.pos.y>WORLD_H-10&&inMouthX)this.onGoal(1);
  }
  onGoal(team){
    if(team===0)this.blueScore+=1; else this.redScore+=1;
    this.goalFlashT=1.4; this.goalFlashTeam=team;
    this.burst(this.ball.pos,30,team===0?"#22d3ee":"#fb4d6d",260);
    this.float({x:WORLD_W/2,y:WORLD_H/2-60},"GOAL!",team===0?"#22d3ee":"#fb4d6d");
    this.shake=16; if(!this.quiet)SFX.play("goal");
    if(this.blueScore>=BALL_GOALS_TO_WIN){ this.finish(true,"Your crew scored 2 goals first — Star Ball champions!"); }
    else if(this.redScore>=BALL_GOALS_TO_WIN){ this.finish(false,"The rival crew scored 2 goals first."); }
    else{ this.resetBallPositions(); }
  }
  updateShowdown(dt){
    const dur=this.matchDuration();
    const t=clamp((this.time-dur*0.16)/(dur*0.5),0,1);
    this.zoneR=Math.hypot(WORLD_W,WORLD_H)/2*(1-t*0.9);
    const center={x:WORLD_W/2,y:WORLD_H/2};
    for(const f of this.fighters){
      if(!f.alive)continue;
      if(dist(f.pos,center)>this.zoneR){
        f.hp-=f.maxHp*0.09*dt; f.lastDamageT=this.time;
        if(Math.random()<dt*3)this.burst(f.pos,2,"#a855f7",70);
        if(f.hp<=0){ f.hp=0; f.alive=false; this.burst(f.pos,18,"#a855f7",220); this.float(f.pos,"STORM KO!","#e9d5ff");
          this.feed.push({a:"Storm",at:-1,b:f.isPlayer?"You":f.name,bt:f.team,t:this.time}); this.sfx("ko",f.pos); }
      }
    }
  }
  updateWinState(dt){
    if(this.mode==="ball"){
      if(!this.finished&&this.timeLeft<=0){
        if(this.blueScore!==this.redScore){
          this.finish(this.blueScore>this.redScore, this.blueScore>this.redScore?"Time! Your crew scored more goals.":"Time! The rival crew scored more goals.");
        }else{ this.finish(false,"A tied game — the rival crew takes it on defense."); }
      }
      return;
    }
    if(this.mode==="arena"){
      if(this.kos[0]>=ARENA_KOS_TO_WIN){ this.finish(true,"Your crew landed 8 KOs first — Arena champions!"); return; }
      if(this.kos[1]>=ARENA_KOS_TO_WIN){ this.finish(false,"The rival crew landed 8 KOs first."); return; }
      if(!this.finished&&this.timeLeft<=0){
        if(this.kos[0]!==this.kos[1]){
          this.finish(this.kos[0]>this.kos[1], this.kos[0]>this.kos[1]?"Time! Your crew landed more KOs.":"Time! The rival crew landed more KOs.");
        }else{
          let hb=0,hr=0;
          for(const f of this.fighters){ if(!f.alive)continue; if(f.team===0)hb+=f.hp; else hr+=f.hp; }
          this.finish(hb>hr, hb>hr?"Tied KOs — your crew has more health left!":"Tied KOs — the rival crew has more health left.");
        }
      }
      return;
    }
    if(this.mode==="train"){
      if(!this.finished&&this.timeLeft<=0)this.finish(true,"Training done: "+this.playerKills+(this.playerKills===1?" KO and ":" KOs and ")+Math.round(this.player.dealt).toLocaleString()+" damage in two minutes.");
      return;
    }
    if(this.mode==="duel"){
      if(this.kos[0]>=DUEL_KOS){ this.finish(true,"You won the duel, "+this.kos[0]+" to "+this.kos[1]+"!"); return; }
      if(this.kos[1]>=DUEL_KOS){ this.finish(false,"Your rival won the duel, "+this.kos[1]+" to "+this.kos[0]+"."); return; }
      if(!this.finished&&this.timeLeft<=0){
        const a=this.kos[0], b=this.kos[1], me=this.fighters[0], foe=this.fighters[3];
        const win=a!==b?a>b:(me.alive?me.hp/me.maxHp:0)>(foe.alive?foe.hp/foe.maxHp:0);
        this.finish(win, a!==b?(win?"Time! You landed more KOs.":"Time! Your rival landed more KOs."):(win?"Tied on KOs, but you had more health left!":"Tied on KOs, and your rival had more health left."));
      }
      return;
    }
    if(this.mode==="titan"){
      if(!this.finished&&this.aliveCount(0)===0&&this.fighters.every(f=>f.team!==0||f.respawnT>2.5))return;
      if(!this.finished&&this.timeLeft<=0){ const t=this.titan; this.finish(false,"Time! The Titan still had "+Math.ceil(100*t.hp/t.maxHp)+"% of its health."); }
      return;
    }
    if(this.mode==="vault"){
      if(!this.finished&&this.timeLeft<=0){
        const a=this.vaults[0].hp/this.vaults[0].maxHp, b=this.vaults[1].hp/this.vaults[1].maxHp;
        if(Math.abs(a-b)>0.001)this.finish(a>b, a>b?"Time! Your vault has more health left.":"Time! The rival vault has more health left.");
        else this.finish(false,"Both vaults are dead even — the rival crew takes it on defense.");
      }
      return;
    }
    if(this.mode==="zone"){
      if(this.zonePts[0]>=100&&this.zonePts[0]>=this.zonePts[1]){ this.finish(true,"Your crew filled the meter first — the zones are yours!"); return; }
      if(this.zonePts[1]>=100){ this.finish(false,"The rival crew filled the meter first."); return; }
      if(!this.finished&&this.timeLeft<=0){
        const a=this.zonePts[0], b=this.zonePts[1];
        this.finish(a>b, a>b?"Time! Your crew held the zones longer.":a<b?"Time! The rival crew held the zones longer.":"A dead-even hold — the rival crew takes it on defense.");
      }
      return;
    }
    if(this.mode==="hunt"){
      if(!this.finished&&this.timeLeft<=0){
        const a=this.stars[0], b=this.stars[1];
        if(a!==b){ this.finish(a>b, a>b?"Time! Your crew collected more stars.":"Time! The rival crew collected more stars."); }
        else{
          let hb=0,hr=0;
          for(const f of this.fighters){ if(!f.alive)continue; if(f.team===0)hb+=f.hp; else hr+=f.hp; }
          this.finish(hb>hr, hb>hr?"Tied on stars — your crew has more health left!":"Tied on stars — the rival crew has more health left.");
        }
      }
      return;
    }
    if(this.mode==="showdown"){
      const ab=this.aliveCount(0), ar=this.aliveCount(1);
      if(ab===0&&ar===0){ this.finish(false,"The storm took everyone — the rivals take it on defense."); }
      else if(ar===0){ this.finish(true,"Last crew standing — your crew wins the Storm Standoff!"); }
      else if(ab===0){ this.finish(false,"Your crew got wiped out in the Storm Standoff."); }
      else if(!this.finished&&this.timeLeft<=0){
        if(ab!==ar){ this.finish(ab>ar, ab>ar?"Time! More of your crew is still standing.":"Time! More rivals are still standing."); }
        else{
          let hb=0,hr=0;
          for(const f of this.fighters){ if(!f.alive)continue; if(f.team===0)hb+=f.hp; else hr+=f.hp; }
          this.finish(hb>hr, hb>hr?"Time! Your crew has more health left.":"Time! The rival crew has more health left.");
        }
      }
      return;
    }
    const blue=this.teamGems(0), red=this.teamGems(1);
    const leader=blue>=GEM_TARGET&&blue>red?"blue":red>=GEM_TARGET&&red>blue?"red":null;
    if(leader){
      if(this.countdownTeam===leader){
        this.countdownT-=dt;
        if(this.countdownT<=0){ this.finish(leader==="blue", leader==="blue"?"Your crew held 10 gems to win the countdown!":"The rival crew held 10 gems to win the countdown."); }
      }else{ this.countdownTeam=leader; this.countdownT=COUNTDOWN_TIME; }
    }else{ this.countdownTeam="fighting"; this.countdownT=COUNTDOWN_TIME; }
    if(!this.finished&&this.timeLeft<=0){
      if(blue!==red){ this.finish(blue>red, blue>red?"Time! Your crew held more gems.":"Time! The rival crew held more gems."); }
      else{
        this.timeLeft=0.01; this.mineT=Math.min(this.mineT,0.5);
        if(this.time>this.matchDuration()+20){ this.finish(false,"A total tie — the rival crew takes it on defense."); }
      }
    }
  }
  finish(won,reason){
    if(this.finished)return;
    this.finished=true;
    const blue=this.teamGems(0), red=this.teamGems(1);
    let mvp=this.fighters[0], bestScore=-1;
    for(const f of this.fighters){
      const score=f.kills*3+f.gems*2+f.dealt/1500;
      if(f.team===(won?0:1)&&score>bestScore){ bestScore=score; mvp=f; }
    }
    if(!this.quiet)SFX.play(won?"win":"lose");
    const sc=this.scores();
    const trophyDelta=this.mode==="duel"?(won?9:-5):this.mode==="titan"?(won?12:-2):this.mode==="ranked"?(won?14:-9):this.mode==="showdown"?(won?10:-6):(won?8:-4);
    this.result={ won, trophyDelta, playerKills:this.playerKills, playerGems:this.player.gems,
      blueGems:blue, redGems:red, mvpName:mvp.isPlayer?"You":mvp.name, reason, mode:this.mode,
      blueScore:sc[0], redScore:sc[1], playerDealt:Math.round(this.player.dealt), mvpIsPlayer:mvp.isPlayer,
      playerCores:this.player.cores, duration:Math.round(this.time) };
  }
  updateZones(dt){
    for(const z of this.zones){
      let a=0,b=0;
      for(const f of this.fighters){ if(!f.alive)continue; if(dist(f.pos,z.pos)<z.r+f.radius*0.4){ if(f.team===0)a++; else b++; } }
      z.owner=a>0&&b===0?0:b>0&&a===0?1:a>0&&b>0?2:-1;
      if(z.owner===0||z.owner===1)this.zonePts[z.owner]=Math.min(100,this.zonePts[z.owner]+dt*100/46);
    }
  }
  damageVault(v,damage,ownerId){
    if(v.hp<=0||this.finished)return;
    v.hp-=damage; v.hitFlash=1;
    const owner=this.fighters[ownerId];
    if(owner){ owner.dealt+=damage*0.5; owner.superCharge=Math.min(1,owner.superCharge+0.5/owner.def.superChargeHits); owner.superReady=owner.superCharge>=1; }
    this.float({x:v.pos.x+(Math.random()-0.5)*50,y:v.pos.y-56},String(Math.round(damage)),"#fde047");
    if(v.hp<=0){
      v.hp=0; this.shake=20; this.burst(v.pos,40,"#fde047",320); this.sfx("boom",v.pos);
      this.finish(v.team===1, v.team===1?"Your crew cracked the rival vault!":"The rival crew cracked your vault.");
    }
  }
  explode(pos,r,damage,team,ownerId,fromSuper,color){
    for(const e of this.fighters){ if(!e.alive||e.team===team)continue; if(dist(pos,e.pos)<r+e.radius*0.6)this.damageFighter(e,damage,ownerId,fromSuper); }
    for(const t of this.turrets){ if(t.team===team)continue; if(dist(pos,t.pos)<r+18){ t.hp-=damage; t.hitFlash=1; if(t.hp<=0)this.burst(t.pos,14,"#fde047",180); } }
    CRATES.forEach((c,i)=>{ if(this.crateAlive[i]&&dist(pos,c)<r+30)this.damageCrate(i,damage,ownerId); });
    for(const v of this.vaults){ if(v.team!==team&&v.hp>0&&dist(pos,v.pos)<r+50)this.damageVault(v,damage,ownerId); }
    this.burst(pos,fromSuper?26:12,color||"#fb923c",fromSuper?260:170);
    this.particles.push({pos:{...pos},vel:{x:0,y:0},life:0.25,maxLife:0.25,size:r,color:"rgba(255,255,255,0.35)",ring:true});
    if(dist(pos,this.player.pos)<420)this.shake=Math.max(this.shake,fromSuper?14:6);
    this.sfx("boom",pos);
  }
  useHyper(f){
    if(!f.alive||!f.hyperOk||f.hyper<1||f.hyperT>0||this.finished)return false;
    f.hyper=0; f.hyperT=HYPER_TIME;
    this.burst(f.pos,26,"#f472b6",240);
    this.particles.push({pos:{...f.pos},vel:{x:0,y:0},life:0.4,maxLife:0.4,size:120,color:"rgba(244,114,182,0.2)",ring:true});
    this.float({x:f.pos.x,y:f.pos.y-f.radius-40},"HYPER SURGE!","#f472b6");
    if(f.isPlayer)this.shake=Math.max(this.shake,10);
    this.sfx("super",f.pos);
    return true;
  }
  useGadget(f){
    if(!f.alive||!f.gad||f.gadN<=0||f.gadCd>0||this.finished)return false;
    f.gadN-=1; f.gadCd=GADGET_CD;
    const g=f.gad;
    if(g==="patch"){ const n=Math.round(f.maxHp*0.35); f.hp=Math.min(f.maxHp,f.hp+n); this.float({x:f.pos.x,y:f.pos.y-f.radius-20},"+"+n,"#4ade80"); this.burst(f.pos,12,"#4ade80",120); }
    else if(g==="jet"){ f.jetT=2.5; this.burst(f.pos,10,"#67e8f9",160); }

function bigZoom(){ const z=Math.min(2,Math.min((window.innerWidth||1280)/1280,(window.innerHeight||720)/760)); return z>1.08?z:1; }
function registerFigure(canvas,def,opts){
  opts=opts||{};

function drawFigureEntry(entry,t){
  const canvas=entry.canvas, ctx=canvas.getContext("2d");

  const w=entry.nebulux?entry.size*1.5:entry.size, h=entry.size;
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){
    canvas.width=w*dpr; canvas.height=h*dpr;
    canvas.style.width=w+"px"; canvas.style.height=h+"px";
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  drawBrawlerFigure(ctx,entry.def,entry.size/2,entry.size/2,entry.size*0.36,{teamRing:entry.ring,facing:entry.facing,nebulux:entry.nebulux,time:t/1000});

function startFigureLoop(){

function mountStarfield(canvas){
  const ctx=canvas.getContext("2d");
  if(!ctx)return;
  const parent=canvas.parentElement;
  const rect=parent.getBoundingClientRect();
  const dpr=Math.min(2,window.devicePixelRatio||1);
  canvas.width=Math.max(1,rect.width*dpr); canvas.height=Math.max(1,rect.height*dpr);
  const stars=Array.from({length:90},(_,i)=>({x:((i*137.5)%100)/100,y:((i*89.3)%100)/100,r:0.6+((i*7)%10)/6,p:(i*0.37)%(Math.PI*2)}));
  let raf=0;
  const draw=(t)=>{
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,rect.width,rect.height);
    for(const s of stars){
      const tw=0.45+0.55*Math.abs(Math.sin(t/1400+s.p));
      ctx.globalAlpha=tw;
      ctx.beginPath(); ctx.arc(s.x*rect.width,s.y*rect.height,s.r,0,Math.PI*2);
      ctx.fillStyle="#e0e7ff"; ctx.fill();
    }
    ctx.globalAlpha=1;

      const active=rarity===r;

    grid.innerHTML="";
    const list=BRAWLERS.filter(b=>(rarity==="All"||b.rarity===rarity)&&b.name.toLowerCase().includes(query.trim().toLowerCase()));
    if(list.length===0){ grid.innerHTML='<p style="grid-column:1/-1;padding:2.5rem 0;text-align:center;font-size:.875rem;font-weight:600;color:#c4b5fd">No brawlers match that search.</p>'; return; }
    for(const b of list){

// Match flow: loading → versus (5s) → game → results

function startMatch(){
  if(NET_MODES.includes(appMode)&&!NETB.skip&&netOk()){ duelQueue(); return; }
  NETB.skip=false;
  const selected=brawlerById(profile.selectedBrawler);
  refreshMaps();
  currentSetup=buildSetup(selected,appMode);
  currentResult=null;
  recordedResult=false;
  showLoading();
}
function recordResult(r){
  if(recordedResult)return;
  recordedResult=true;
  if(r.mode==="train"){ r.trophyDelta=0; r.rewards={coins:0,tokens:0,pods:0,tokensNow:profile.tokens,questsDone:[],road:roadReady(),streak:(profile.stats||{}).streak||0,brawlerTrophies:(profile.bt||{})[profile.selectedBrawler]||0}; return; }
  ensureProfile(); ensureQuests();
  const id=profile.selectedBrawler;
  profile.trophies=Math.max(0,profile.trophies+r.trophyDelta);
  profile.bt[id]=Math.max(0,(profile.bt[id]||0)+r.trophyDelta);
  profile.games+=1;
  if(r.won)profile.wins+=1; else profile.losses+=1;
  const st=profile.stats;
  st.kos+=r.playerKills; st.dealt+=r.playerDealt||0; if(r.mvpIsPlayer)st.mvps+=1;
  st.streak=r.won?st.streak+1:0; st.bestStreak=Math.max(st.bestStreak,st.streak);
  const coins=(r.won?30:12)+Math.min(20,r.playerKills*4)+(r.mvpIsPlayer?10:0)+(r.won&&st.streak>=3?10:0);
  const tokens=r.won?40:20;
  profile.coins+=coins; profile.tokens+=tokens;
  let pods=0; while(profile.tokens>=POD_TOKENS){ profile.tokens-=POD_TOKENS; profile.pods+=1; pods++; }
  const q=profile.quests; const done=[];
  if(q.modes.indexOf(r.mode)<0)q.modes.push(r.mode);
  for(const x of q.list){
    const was=x.n>=x.goal;
    if(x.k==="wins"&&r.won)x.n+=1; else if(x.k==="kos")x.n+=r.playerKills; else if(x.k==="dealt")x.n+=r.playerDealt||0;
    else if(x.k==="play")x.n+=1; else if(x.k==="mvp"&&r.mvpIsPlayer)x.n+=1; else if(x.k==="gems")x.n+=r.playerGems||0; else if(x.k==="modes")x.n=q.modes.length;
    if(!was&&x.n>=x.goal)done.push(x.text);
  }
  r.rewards={coins,tokens,pods,tokensNow:profile.tokens,questsDone:done,road:roadReady(),streak:st.streak,brawlerTrophies:profile.bt[id]};
  saveProfile();
}
function showLoading(){
  const setup=currentSetup;
  const vh=viewportH();
  const compact=vh<620;
  const info=MODE_INFO[setup.mode];
  const tip=TIPS[Math.floor(Math.random()*TIPS.length)];

// =====================================================================
// Virtual joystick: wherever the thumb lands inside the zone becomes
// the base; drag to steer. Reports a vector (magnitude 0..1) or null
// when released.
// =====================================================================
function attachJoystick(zone,color,size,onChange){
  size=size||132;
  const R=46;
  const base=el('<div class="stick-base" aria-hidden="true"></div>');
  base.style.width=size+"px"; base.style.height=size+"px";
  base.style.borderColor=color;
  base.style.background="radial-gradient(circle at 50% 38%, rgba(255,255,255,0.13), rgba(10,8,30,0.42) 68%)";
  base.style.boxShadow="inset 0 0 0 10px rgba(255,255,255,0.05), inset 0 -8px 18px rgba(0,0,0,0.35), 0 6px 18px rgba(0,0,0,0.35)";
  base.style.opacity="0.45"; base.style.left="50%"; base.style.top="50%";
  const knob=el('<div class="stick-knob" aria-hidden="true"></div>');
  knob.style.width=(size*0.46)+"px"; knob.style.height=(size*0.46)+"px";
  knob.style.background="radial-gradient(circle at 34% 28%, rgba(255,255,255,0.75), "+color+" 52%, rgba(0,0,0,0.28) 130%)";
  knob.style.boxShadow="0 5px 16px rgba(0,0,0,0.5), inset 0 -5px 9px rgba(0,0,0,0.3), inset 0 4px 8px rgba(255,255,255,0.4), 0 0 0 3px rgba(255,255,255,0.25)";
  knob.style.transform="translate(-50%,-50%)";
  base.appendChild(knob);
  zone.appendChild(base);
  let state=null;
  const setKnob=(dx,dy)=>{ knob.style.transform="translate(calc(-50% + "+dx+"px), calc(-50% + "+dy+"px))"; };
  const place=(cx,cy)=>{ const zr=zone.getBoundingClientRect(); base.style.left=(cx-zr.left)+"px"; base.style.top=(cy-zr.top)+"px"; base.style.opacity="1"; };
  zone.addEventListener("pointerdown",(e)=>{
    if(state)return;
    state={id:e.pointerId,cx:e.clientX,cy:e.clientY};
    try{ zone.setPointerCapture(e.pointerId); }catch(err){}
    place(e.clientX,e.clientY); setKnob(0,0);
    onChange({x:0,y:0});
  });
  zone.addEventListener("pointermove",(e)=>{
    if(!state||e.pointerId!==state.id)return;
    let dx=e.clientX-state.cx, dy=e.clientY-state.cy;
    const d=Math.hypot(dx,dy);
    if(d>R){ dx=(dx/d)*R; dy=(dy/d)*R; }
    setKnob(dx,dy);
    onChange({x:dx/R,y:dy/R});
  });
  const up=(e)=>{
    if(!state||e.pointerId!==state.id)return;
    state=null; base.style.opacity="0.45"; setKnob(0,0);
    onChange(null);
  };
  zone.addEventListener("pointerup",up);
  zone.addEventListener("pointercancel",up);
}
