<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Balloon Siege · Tower Defense</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#7ec8ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block}
.hud{position:fixed;top:10px;left:10px;display:flex;gap:8px;z-index:5;flex-wrap:wrap}
.chip{background:rgba(10,14,30,.72);color:#fff;border-radius:12px;padding:7px 12px;font-weight:800;font-size:17px;text-shadow:0 1px 0 #0008;display:flex;align-items:center;gap:6px}
.right{position:fixed;top:10px;right:10px;display:flex;gap:8px;z-index:5}
.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:800;font-size:16px;color:#fff;cursor:pointer;background:#455a64;box-shadow:0 3px 0 #0005;text-shadow:0 1px 0 #0006}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0005}
.go{background:linear-gradient(#66bb6a,#2e7d32)}
.bar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5}
.slot{width:78px;height:86px;border-radius:12px;background:rgba(10,14,30,.75);border:3px solid transparent;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-weight:800;font-size:12px;position:relative}
.slot .ic{font-size:30px;line-height:1}
.slot .k{position:absolute;top:3px;left:6px;font-size:11px;opacity:.7}
.slot .c{color:#ffe082}
.slot.on{border-color:#ffe082;background:rgba(40,40,10,.85)}
.slot.no{opacity:.45}
.panel{position:fixed;right:10px;top:64px;width:250px;background:rgba(10,14,30,.88);color:#fff;border-radius:14px;padding:14px;z-index:6;display:none}
.panel h3{font-size:19px;margin-bottom:4px}
.panel p{font-size:13px;opacity:.85;margin:2px 0}
.panel .row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.panel .btn{font-size:14px;padding:8px 10px;flex:1}
.ov{position:fixed;inset:0;background:rgba(5,10,30,.55);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:rgba(15,20,45,.95);color:#fff;border-radius:20px;padding:26px;text-align:center;max-width:560px;width:calc(100% - 32px);box-shadow:0 10px 40px #0008}
.box h1{font-size:44px;font-weight:900;letter-spacing:1px;background:linear-gradient(#fff59d,#ff8a65);-webkit-background-clip:text;background-clip:text;color:transparent}
.box p{opacity:.85;margin:8px 0 16px}
.diffs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);color:#fff;font-size:34px;font-weight:900;text-shadow:0 3px 0 #000a;z-index:7;pointer-events:none;opacity:0;transition:opacity .3s;text-align:center}
.tip{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(10,14,30,.6);padding:6px 12px;border-radius:10px;font-size:13px;font-weight:700;z-index:5;white-space:nowrap}
#joy{position:fixed;left:24px;bottom:120px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.35);z-index:6;display:none}
#joyk{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.6)}
.rot{position:fixed;bottom:250px;z-index:6;display:none;width:52px;height:52px;border-radius:50%;font-size:24px;padding:0}
@media (max-width:700px){.slot{width:52px;height:66px}.slot .ic{font-size:22px}.slot .n{display:none}.chip{font-size:14px;padding:5px 9px}.box h1{font-size:34px}.tip{display:none}.panel{width:200px}}
</style>
</head>
<body>
<div class="hud">
  <div class="chip">❤️ <span id="lives">100</span></div>
  <div class="chip">💰 <span id="cash">650</span></div>
  <div class="chip">🌊 Wave <span id="wave">0</span>/40</div>
</div>
<div class="right">
  <button class="btn" id="speed">⏩ 1x</button>
  <button class="btn go" id="start">▶ START WAVE</button>
</div>
<div class="bar" id="bar"></div>
<div class="tip" id="tip">WASD to walk · drag to look around · pick a tower (1-6) and click the ground to place it</div>
<div class="panel" id="panel">
  <h3 id="pn"></h3>
  <p id="pd"></p>
  <p id="ps"></p>
  <div class="row"><button class="btn go" id="pup"></button></div>
  <div class="row"><button class="btn" id="ptarget"></button><button class="btn" id="psell" style="background:#c62828"></button></div>
</div>
<div class="toast" id="toast"></div>
<div id="joy"><div id="joyk"></div></div>
<button class="btn rot" id="rotL" style="left:24px">⟲</button>
<button class="btn rot" id="rotR" style="left:88px">⟳</button>
<div class="ov" id="menu"><div class="box">
  <h1>🎈 BALLOON SIEGE</h1>
  <p>Balloons are floating toward your castle! Walk around, build towers along the path and pop every last one. Survive 40 waves to win.</p>
  <div class="diffs">
    <button class="btn go" data-d="easy">EASY</button>
    <button class="btn" style="background:linear-gradient(#ffa726,#ef6c00)" data-d="medium">MEDIUM</button>
    <button class="btn" style="background:linear-gradient(#ef5350,#b71c1c)" data-d="hard">HARD</button>
  </div>
  <p id="best" style="margin-top:14px;font-size:13px"></p>
</div></div>
<div class="ov" id="end" style="display:none"><div class="box">
  <h1 id="et"></h1><p id="ed"></p>
  <button class="btn go" id="again">PLAY AGAIN</button>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const TOUCH = matchMedia("(pointer:coarse)").matches;

// ---------- save ----------
let SAVE = { best: { easy: 0, medium: 0, hard: 0 }, wins: 0 };
try { Object.assign(SAVE, JSON.parse(localStorage.getItem("bs-save") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("bs-save", JSON.stringify(SAVE)); } catch (e) {} };

// ---------- sound ----------
let AC = null;
function sfx(f, d = .08, type = "square", v = .05, slide = 0) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
let popT = 0;
const popSound = () => { const n = performance.now(); if (n - popT < 35) return; popT = n; sfx(700 + Math.random() * 500, .06, "triangle", .05, .4); };

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd3ff);
scene.fog = new THREE.Fog(0x8fd3ff, 90, 190);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, .1, 400);
scene.add(new THREE.HemisphereLight(0xffffff, 0x5a8f3c, .75));
const sun = new THREE.DirectionalLight(0xffffff, .85);
sun.position.set(40, 70, 25); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -80, right: 80, top: 80, bottom: -80, far: 200 });
scene.add(sun);
addEventListener("resize", () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

const M = (c, o = {}) => new THREE.MeshLambertMaterial({ color: c, ...o });
const at = (m, x, y, z) => (m.position.set(x, y, z), m);
const box = (w, h, d, c) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(c)); m.castShadow = true; m.receiveShadow = true; return m; };

// ground
const ground = new THREE.Mesh(new THREE.PlaneGeometry(160, 160, 1, 1), M(0x6cc24a));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const edge = new THREE.Mesh(new THREE.BoxGeometry(160, 6, 160), M(0x7a5230));
edge.position.y = -3.01; scene.add(edge);

// the path the balloons follow
const PATH = [[-62, -40], [-20, -40], [-20, -10], [-45, -10], [-45, 22], [0, 22], [0, -26], [32, -26], [32, 38], [62, 38]].map(([x, z]) => new THREE.Vector3(x, 0, z));
const SEG = [];
let PLEN = 0;
for (let i = 0; i < PATH.length - 1; i++) { const a = PATH[i], b = PATH[i + 1], l = a.distanceTo(b); SEG.push({ a, b, l, s: PLEN }); PLEN += l; }
function pathAt(s) {
  s = Math.max(0, Math.min(PLEN, s));
  for (const g of SEG) if (s <= g.s + g.l) return g.a.clone().lerp(g.b, (s - g.s) / g.l);
  return PATH[PATH.length - 1].clone();
}
function distToPath(p) {
  let best = 1e9;
  for (const g of SEG) {
    const ab = g.b.clone().sub(g.a), t = Math.max(0, Math.min(1, p.clone().sub(g.a).dot(ab) / ab.lengthSq()));
    best = Math.min(best, p.distanceTo(g.a.clone().addScaledVector(ab, t)));
  }
  return best;
}
const pathMat = M(0xd9b77a), pathEdge = M(0xb89458);
for (const g of SEG) {
  const mid = g.a.clone().add(g.b).multiplyScalar(.5), ang = Math.atan2(g.b.x - g.a.x, g.b.z - g.a.z);
  const p = new THREE.Mesh(new THREE.BoxGeometry(5, .12, g.l + 5), pathMat); p.position.set(mid.x, .06, mid.z); p.rotation.y = ang; p.receiveShadow = true; scene.add(p);
  const e = new THREE.Mesh(new THREE.BoxGeometry(6, .08, g.l + 6), pathEdge); e.position.set(mid.x, .04, mid.z); e.rotation.y = ang; scene.add(e);
}
// the portal they come from and the castle they're after
{
  const st = PATH[0], ring = new THREE.Mesh(new THREE.TorusGeometry(4, .6, 10, 30), M(0x8e24aa, { emissive: 0x4a148c }));
  ring.position.set(st.x, 4.5, st.z); ring.rotation.y = Math.PI / 2; scene.add(ring);
  const glow = new THREE.Mesh(new THREE.CircleGeometry(3.5, 24), new THREE.MeshBasicMaterial({ color: 0xce93d8, transparent: true, opacity: .55, side: THREE.DoubleSide }));
  glow.position.copy(ring.position); glow.rotation.y = Math.PI / 2; scene.add(glow);
  const en = PATH[PATH.length - 1], castle = new THREE.Group();
  castle.add(at(box(10, 7, 10, 0xb0bec5), 0, 3.5, 0));
  for (const [x, z] of [[-5, -5], [5, -5], [-5, 5], [5, 5]]) {
    castle.add(at(box(3, 11, 3, 0x90a4ae), x, 5.5, z));
    const roof = new THREE.Mesh(new THREE.ConeGeometry(2.4, 3, 4), M(0xc62828)); roof.position.set(x, 12.5, z); roof.rotation.y = Math.PI / 4; castle.add(roof);
  }
  castle.add(at(box(.4, 4, 3, 0x5d4037), -5.1, 2, 0));
  castle.position.set(en.x + 6, 0, en.z); scene.add(castle);
}
// trees and rocks (never on the path)
const OBST = [];
const rnd = (() => { let s = 7; return () => ((s = (s * 16807) % 2147483647) / 2147483647); })();
for (let i = 0; i < 70; i++) {
  const p = new THREE.Vector3(rnd() * 150 - 75, 0, rnd() * 150 - 75);
  if (distToPath(p) < 7 || p.length() < 8) continue;
  if (rnd() < .7) {
    const t = new THREE.Group();
    t.add(at(box(.9, 3, .9, 0x6d4c41), 0, 1.5, 0));
    const top = new THREE.Mesh(new THREE.ConeGeometry(2.4 + rnd(), 5, 7), M(rnd() < .5 ? 0x2e7d32 : 0x388e3c)); top.position.y = 5; top.castShadow = true; t.add(top);
    t.position.copy(p); t.userData.block = 1.8; scene.add(t); OBST.push(t);
  } else {
    const r = new THREE.Mesh(new THREE.DodecahedronGeometry(1 + rnd() * 1.2), M(0x9e9e9e)); r.position.set(p.x, .6, p.z); r.castShadow = true; r.userData.block = 1.6; scene.add(r); OBST.push(r);
  }
}

// ---------- the player (a blocky character, third person) ----------
function makeChar(shirt) {
  const g = new THREE.Group();
  const skin = 0xffcc99;
  const legL = box(.55, 1.4, .55, 0x1e3a8a), legR = box(.55, 1.4, .55, 0x1e3a8a);
  legL.geometry.translate(0, -.7, 0); legR.geometry.translate(0, -.7, 0);
  legL.position.set(-.3, 1.4, 0); legR.position.set(.3, 1.4, 0);
  const body = box(1.2, 1.4, .7, shirt); body.position.y = 2.1;
  const armL = box(.45, 1.3, .45, shirt), armR = box(.45, 1.3, .45, shirt);
  armL.geometry.translate(0, -.6, 0); armR.geometry.translate(0, -.6, 0);
  armL.position.set(-.85, 2.75, 0); armR.position.set(.85, 2.75, 0);
  const head = box(.9, .9, .9, skin); head.position.y = 3.3;
  const eyes = box(.5, .12, .05, 0x111111); eyes.position.set(0, 3.4, .46);
  g.add(legL, legR, body, armL, armR, head, eyes);
  g.userData = { legL, legR, armL, armR };
  return g;
}
const player = makeChar(0xff7043);
player.position.set(-10, 0, 5);
scene.add(player);
let camYaw = Math.PI * .75, camPitch = .55, camDist = 22;
const keys = {};
addEventListener("keydown", (e) => { keys[e.code] = true; onKey(e); });
addEventListener("keyup", (e) => { keys[e.code] = false; });

// ---------- balloons ----------
// Each layer pops into the next: pop a pink and a yellow comes out, and so on down to red.
const TIERS = [
  { n: "Red", col: 0xe53935, spd: 7, kids: [] },
  { n: "Blue", col: 0x1e88e5, spd: 8.5, kids: [0] },
  { n: "Green", col: 0x43a047, spd: 10, kids: [1] },
  { n: "Yellow", col: 0xfdd835, spd: 13, kids: [2] },
  { n: "Pink", col: 0xec407a, spd: 15, kids: [3] },
  { n: "Dark", col: 0x263238, spd: 9, kids: [4, 4], size: .8 },
  { n: "Steel", col: 0xb0bec5, spd: 7, kids: [5, 5], armor: true, metal: true },
  { n: "Clay", col: 0x8d6e63, spd: 8, kids: [5, 5], hp: 10 },
  { n: "Blimp", col: 0x7e57c2, spd: 3.2, kids: [7, 7, 7, 7], hp: 200, boss: true },
];
const RBE = TIERS.map(() => 0);
TIERS.forEach((t, i) => { RBE[i] = (t.hp || 1) + t.kids.reduce((a, k) => a + RBE[k], 0); });
const BGEO = new THREE.SphereGeometry(1, 18, 14);
const BMAT = TIERS.map((t) => new THREE.MeshPhongMaterial({ color: t.col, shininess: t.metal ? 120 : 60, specular: t.metal ? 0xffffff : 0x444444 }));
const KNOT = new THREE.ConeGeometry(.22, .35, 8);
const STR = new THREE.CylinderGeometry(.03, .03, 1.6, 4);
const STRM = new THREE.MeshBasicMaterial({ color: 0xeeeeee });
let BAL = [];
function spawnBalloon(tier, s = 0) {
  const t = TIERS[tier], g = new THREE.Group(), sc = t.boss ? 4.2 : (t.size || 1) * .95;
  const b = new THREE.Mesh(BGEO, BMAT[tier]); b.scale.set(sc * .9, sc * 1.1, sc * .9); b.castShadow = true; g.add(b);
  if (t.boss) { b.scale.set(sc * 1.8, sc * .9, sc * .9); }
  else {
    const k = new THREE.Mesh(KNOT, BMAT[tier]); k.position.y = -sc * 1.12; k.rotation.x = Math.PI; g.add(k);
    const st = new THREE.Mesh(STR, STRM); st.position.y = -sc * 1.12 - .9; g.add(st);
  }
  if (t.armor) { const bands = new THREE.Mesh(new THREE.TorusGeometry(sc * .92, .09, 6, 20), M(0x546e7a)); bands.rotation.x = Math.PI / 2; g.add(bands); }
  scene.add(g);
  const o = { tier, hp: t.hp || 1, s, g, slow: 0, bob: Math.random() * 6, id: Math.random() };
  BAL.push(o);
  return o;
}
function removeBalloon(o) { scene.remove(o.g); o.dead = true; }

// Damage pops layers; what's left of the hit goes on to the layers inside.
function damage(o, dmg, src) {
  if (o.dead || dmg <= 0) return;
  const t = TIERS[o.tier];
  if (t.armor && !(src && src.popsSteel)) { sfx(1400, .03, "square", .02); return; }
  o.hp -= dmg;
  if (o.hp > 0) { if (t.boss || t.hp) flash(o); return; }
  const over = -o.hp;
  cash += 1; popped++;
  popFx(o.g.position, TIERS[o.tier].col, t.boss ? 3 : 1);
  popSound();
  removeBalloon(o);
  t.kids.forEach((k, i) => {
    const c = spawnBalloon(k, o.s - i * 1.2);
    c.slow = o.slow;
    if (over > 0) damage(c, over, src);
  });
}
function flash(o) { o.g.children[0].material = o.g.children[0].material.clone(); o.g.children[0].material.emissive = new THREE.Color(0x662222); setTimeout(() => { if (o.g.children[0]) o.g.children[0].material = BMAT[o.tier]; }, 90); }

// pop bits
const FX = [];
const BIT = new THREE.BoxGeometry(.25, .25, .25);
function popFx(pos, col, n) {
  for (let i = 0; i < 6 * n; i++) {
    const m = new THREE.Mesh(BIT, new THREE.MeshBasicMaterial({ color: col }));
    m.position.copy(pos); scene.add(m);
    FX.push({ m, v: new THREE.Vector3((Math.random() - .5) * 10, Math.random() * 8, (Math.random() - .5) * 10), life: .5 });
  }
}

// ---------- towers ----------
// Every tower has 3 upgrades. Prices are for Medium; Easy and Hard scale them.
const TOWERS = [
  { id: "dart", n: "Dart Tower", ic: "🎯", cost: 200, col: 0x8d6e63, d: "Fast darts. Good all-rounder.",
    lv: [{ range: 14, rate: 1.1, dmg: 1, pierce: 2 }, { up: 150, n: "Longer reach", range: 18 }, { up: 260, n: "Quick throws", rate: 2 }, { up: 420, n: "Razor darts: pops Steel", pierce: 4, popsSteel: true }] },
  { id: "cannon", n: "Cannon", ic: "💣", cost: 450, col: 0x37474f, d: "Splash damage. Pops Steel.", popsSteel: true,
    lv: [{ range: 13, rate: .75, dmg: 1, splash: 3.5 }, { up: 250, n: "Bigger blast", splash: 5 }, { up: 400, n: "Double powder", dmg: 2 }, { up: 900, n: "Cluster bombs", rate: 1.2, splash: 6.5 }] },
  { id: "frost", n: "Frost Tower", ic: "❄️", cost: 350, col: 0x4fc3f7, d: "Slows everything nearby.",
    lv: [{ range: 9, rate: .7, dmg: 0, slow: .5 }, { up: 200, n: "Wider chill", range: 12 }, { up: 300, n: "Deep freeze", slow: .3 }, { up: 650, n: "Ice shards: pops too", dmg: 1 }] },
  { id: "sniper", n: "Sniper", ic: "🔭", cost: 400, col: 0x558b2f, d: "Hits anywhere on the map. Pops Steel.", popsSteel: true,
    lv: [{ range: 999, rate: .55, dmg: 2 }, { up: 300, n: "Faster bolt", rate: .9 }, { up: 550, n: "Heavy rounds", dmg: 5 }, { up: 1300, n: "Elite marksman", rate: 1.8, dmg: 8 }] },
  { id: "tesla", n: "Tesla Coil", ic: "⚡", cost: 650, col: 0x5e35b1, d: "Lightning jumps between balloons. Pops Steel.", popsSteel: true,
    lv: [{ range: 11, rate: 1.1, dmg: 1, chain: 3 }, { up: 350, n: "Longer arcs", chain: 5 }, { up: 600, n: "Overcharge", dmg: 2 }, { up: 1500, n: "Storm core", chain: 9, rate: 1.8 }] },
  { id: "farm", n: "Balloon Farm", ic: "🌾", cost: 900, col: 0xf9a825, d: "Makes cash after every wave.",
    lv: [{ range: 0, income: 90 }, { up: 500, n: "Bigger fields", income: 160 }, { up: 900, n: "Market stall", income: 260 }, { up: 1800, n: "Gold mine", income: 450 }] },
];
let TW = [];
const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .25, depthWrite: false });
function towerStats(t) { const s = {}; for (let i = 0; i <= t.level; i++) Object.assign(s, t.def.lv[i]); s.popsSteel = !!(s.popsSteel || t.def.popsSteel); return s; }
function makeTowerMesh(def) {
  const g = new THREE.Group();
  g.add(at(box(3.2, 1, 3.2, 0x9e9e9e), 0, .5, 0));
  if (def.id === "farm") {
    g.add(at(box(3, 2.5, 3, 0xc62828), 0, 2.2, 0));
    const r = new THREE.Mesh(new THREE.ConeGeometry(2.6, 1.8, 4), M(0x5d4037)); r.position.y = 4.3; r.rotation.y = Math.PI / 4; g.add(r);
  } else {
    const body = box(2, 2.6, 2, def.col); body.position.y = 2.3; g.add(body);
    const head = new THREE.Group(); head.position.y = 3.9; g.add(head);
    if (def.id === "dart") head.add(at(box(.4, .4, 2.2, 0xffd54f), 0, .2, .8), box(1.4, 1, 1.4, 0x6d4c41));
    if (def.id === "cannon") { const c = new THREE.Mesh(new THREE.CylinderGeometry(.5, .6, 2.6, 12), M(0x212121)); c.rotation.x = Math.PI / 2; c.position.z = .9; head.add(c, box(1.6, 1, 1.6, 0x455a64)); }
    if (def.id === "frost") { const c = new THREE.Mesh(new THREE.OctahedronGeometry(1.1), M(0xb3e5fc, { emissive: 0x0277bd })); c.position.y = .5; head.add(c); }

    else if (tw.target === "last") target = inRange.reduce((a, b) => (b.s < a.s ? b : a));
    else if (tw.target === "strong") target = inRange.reduce((a, b) => (RBE[b.tier] > RBE[a.tier] ? b : a));
    else target = inRange.reduce((a, b) => (b.g.position.distanceTo(pos) < a.g.position.distanceTo(pos) ? b : a));
    const head = tw.g.userData.head;
    if (head) head.rotation.y = Math.atan2(target.g.position.x - pos.x, target.g.position.z - pos.z);
    if (tw.cd > 0) continue;
    tw.cd = 1 / s.rate;
    const from = tmp.set(pos.x, 4.2, pos.z).clone();
    if (tw.def.id === "dart") {
      const m = new THREE.Mesh(DART, M(0xffd54f)); m.position.copy(from); scene.add(m);
      SHOTS.push({ m, kind: "dart", target, speed: 60, s, hits: s.pierce, hit: new Set() });
      sfx(1200, .03, "square", .02, .7);
    } else if (tw.def.id === "cannon") {
      const m = new THREE.Mesh(BALL, M(0x212121)); m.position.copy(from); scene.add(m);
      const to = target.g.position.clone(), t0 = from.distanceTo(to) / 32;
      SHOTS.push({ m, kind: "ball", from, to, t: 0, t0, s });
      sfx(160, .15, "sawtooth", .05, .6);
    } else if (tw.def.id === "sniper") {
      lineFx(from, target.g.position.clone(), 0xffff8d, .08);
      damage(target, s.dmg, s);
      sfx(1800, .05, "square", .04, .3);
    } else if (tw.def.id === "tesla") {
      let cur = target, prev = from;
      const hit = new Set();
      for (let i = 0; i < s.chain && cur; i++) {
        hit.add(cur);
        const at = cur.g.position.clone();
        lineFx(prev, at, 0xb388ff, .12);
        damage(cur, s.dmg, s);
        prev = at;
        cur = BAL.filter((b) => !b.dead && !hit.has(b) && b.g.position.distanceTo(at) < 7).sort((a, b) => a.g.position.distanceTo(at) - b.g.position.distanceTo(at))[0];
      }
      sfx(300 + Math.random() * 200, .08, "sawtooth", .03, 2);
    }
  }

  // projectiles
  for (let i = SHOTS.length - 1; i >= 0; i--) {
    const sh = SHOTS[i];
    if (sh.kind === "dart") {
      if (sh.target.dead) { const n = BAL.find((b) => !b.dead && !sh.hit.has(b) && b.g.position.distanceTo(sh.m.position) < 8); if (n) sh.target = n; else { scene.remove(sh.m); SHOTS.splice(i, 1); continue; } }
      const to = sh.target.g.position, d = to.clone().sub(sh.m.position), dl = d.length();
      sh.m.lookAt(to);
      if (dl < 1.2) {
        damage(sh.target, sh.s.dmg, sh.s); sh.hit.add(sh.target); sh.hits--;
        const n = sh.hits > 0 && BAL.find((b) => !b.dead && !sh.hit.has(b) && b.g.position.distanceTo(sh.m.position) < 6);
        if (n) sh.target = n; else { scene.remove(sh.m); SHOTS.splice(i, 1); }
      } else sh.m.position.addScaledVector(d.normalize(), Math.min(dl, sh.speed * dt));
    } else {
      sh.t += dt / sh.t0;
      const k = Math.min(1, sh.t);
      sh.m.position.lerpVectors(sh.from, sh.to, k); sh.m.position.y += Math.sin(k * Math.PI) * 6;
      if (k >= 1) {
        scene.remove(sh.m); SHOTS.splice(i, 1);
        ringFx(sh.to, sh.s.splash, 0xff7043);
        for (const b of BAL) if (!b.dead && b.g.position.distanceTo(sh.to) <= sh.s.splash + (TIERS[b.tier].boss ? 3 : 0)) damage(b, sh.s.dmg, sh.s);
        sfx(90, .25, "sawtooth", .07, .4);
      }
    }
  }
  if (running && !queue.length && !BAL.length) endWave();
  hudSoon();
}
let hudT = 0;
function hudSoon() { const n = performance.now(); if (n - hudT > 150) { hudT = n; hud(); } }

drawBar(); hud();
requestAnimationFrame(step);
})();
</script>
