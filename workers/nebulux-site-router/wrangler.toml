# The subdomain router for published sites (renamed from blackhole-site-router on 2026-09-25).
# Cloudflare dashboard as of 2026-09-22. Deploy from this folder: npx wrangler deploy
name = "nebulux-site-router"
main = "worker.js"
compatibility_date = "2026-09-22"
routes = [
  { pattern = "*.nebuluxai.com/*", zone_name = "nebuluxai.com" },
  # People's own domains (Cloudflare for SaaS custom hostnames) reach the zone as any hostname.
  { pattern = "*/*", zone_name = "nebuluxai.com" },
]

[observability]
enabled = true

# The site's KV: custom domains (domain:<hostname> -> { site }) set up in the Website Designer.
[[kv_namespaces]]
binding = "KV"
id = "3ae4e5a66e7f459296bf6c6b99951436"


# Crashes are recorded in the site's database for Monitor → Errors (cloudflare-lib/errorlog.js).
[[d1_databases]]
binding = "DB"
database_name = "nebulux-db"
database_id = "98651468-6280-498a-8641-b24d1725e6f9"

# Maintenance: "on" shows "temporarily down" to everyone but the owner (see worker.js).
[vars]
MAINTENANCE = "on"
