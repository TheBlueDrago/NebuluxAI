# Nebulux Chat server. Deploy from this folder: npx wrangler deploy
# DB schema: schema.sql (npx wrangler d1 execute nebulux-chat --remote --file schema.sql)
name = "nebulux-chat"
main = "worker.js"
compatibility_date = "2026-09-22"
workers_dev = false
routes = [{ pattern = "chat.nebuluxai.com/*", zone_name = "nebuluxai.com" }]

[[d1_databases]]
binding = "DB"
database_name = "nebulux-chat"
database_id = "3b4aa9ee-b838-4e0a-a56e-678726393bef"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[observability]
enabled = true

# The site's KV (same namespace as the Pages app): chat invites are recorded as
# chatreferredby:<userId> so the inviter gets credits when that person upgrades.
[[kv_namespaces]]
binding = "KV"
id = "3ae4e5a66e7f459296bf6c6b99951436"
